<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>4-in-1 NAVIER-STOKES | Unlimited Particle Supply</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: 'Monaco', 'Fira Code', monospace; }
        
        .tab-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 300;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            pointer-events: auto;
        }
        .tab-btn {
            background: rgba(0,0,0,0.8);
            border: 1px solid #0ff;
            color: #0ff;
            padding: 8px 18px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        .tab-btn.active {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 15px #0ff;
        }
        .tab-btn:hover:not(.active) { background: #0ff3; }
        
        .info-panel {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            border-top: 2px solid #0ff;
            padding: 10px 15px;
            z-index: 300;
            pointer-events: auto;
            font-size: 10px;
            color: #0ff;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 10px;
        }
        .info-item { display: flex; gap: 8px; align-items: baseline; }
        .info-label { color: #888; }
        .info-value { color: #ffaa44; font-weight: bold; }
        
        .ctrl-group {
            position: absolute;
            top: 80px;
            right: 15px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
        }
        .ctrl-btn {
            background: rgba(0,0,0,0.7);
            border: 1px solid #ffaa44;
            color: #ffaa44;
            padding: 6px 12px;
            font-size: 10px;
            cursor: pointer;
            font-family: monospace;
        }
        .ctrl-btn:hover { background: #ffaa44; color: #000; }
        
        .supply-badge {
            background: #00aa44;
            color: #000;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: bold;
        }
        
        @media (max-width: 700px) {
            .tab-btn { padding: 4px 10px; font-size: 9px; }
            .info-panel { font-size: 8px; padding: 6px 10px; }
            .ctrl-btn { padding: 3px 8px; font-size: 8px; }
        }
    </style>
</head>
<body>
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="airfoil">✈️ AIRFOIL · SST k-ω</button>
        <button class="tab-btn" data-tab="hemo">🩸 HEMODYNAMICS · Womersley</button>
        <button class="tab-btn" data-tab="rossby">🌍 ROSSBY WAVE · β-plane</button>
        <button class="tab-btn" data-tab="nonnewton">🧬 NON-NEWTONIAN · Carreau-Yasuda</button>
    </div>
    
    <div class="ctrl-group">
        <button id="reset-cam" class="ctrl-btn">⟳ RESET CAMERA</button>
        <button id="toggle-fog" class="ctrl-btn">🌫️ TOGGLE FOG</button>
        <button id="manual-reset" class="ctrl-btn">🔄 RESET PARTICLES</button>
    </div>
    
    <div class="info-panel" id="info-panel">
        <div class="info-item"><span class="info-label">PARTICLES:</span><span id="particle-count" class="info-value">--</span></div>
        <div class="info-item"><span class="info-label">ACTIVE:</span><span id="active-count" class="info-value">--</span></div>
        <div class="info-item"><span class="info-label">FPS:</span><span id="fps-val" class="info-value">--</span></div>
        <div class="info-item"><span class="info-label">Re:</span><span id="re-val" class="info-value">--</span></div>
        <div class="info-item"><span class="info-label">Supply Mode:</span><span id="supply-mode" class="info-value supply-badge">RECYCLE</span></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ========== GLOBAL SETUP ==========
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010118);
        scene.fog = new THREE.FogExp2(0x010118, 0.002);
        
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 4, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        document.body.appendChild(renderer.domElement);
        
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.1, 0.3, 0.85);
        effectComposer.addPass(bloomPass);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.zoomSpeed = 1.2;
        controls.target.set(0, 0, 0);
        
        document.getElementById('reset-cam').addEventListener('click', () => {
            camera.position.set(5, 4, 8);
            controls.target.set(0, 0, 0);
            controls.update();
        });
        
        let fogEnabled = true;
        document.getElementById('toggle-fog').addEventListener('click', () => {
            fogEnabled = !fogEnabled;
            scene.fog = fogEnabled ? new THREE.FogExp2(0x010118, 0.002) : null;
        });
        
        // Lights
        const ambient = new THREE.AmbientLight(0x111122);
        scene.add(ambient);
        const mainLight = new THREE.DirectionalLight(0x88aaff, 1);
        mainLight.position.set(2, 5, 3);
        scene.add(mainLight);
        const fillLight = new THREE.PointLight(0xffaa66, 0.5);
        fillLight.position.set(-2, 2, 3);
        scene.add(fillLight);
        
        const grid = new THREE.GridHelper(15, 30, 0x00ccff, 0x3366aa);
        grid.position.y = -1.2;
        grid.material.transparent = true;
        grid.material.opacity = 0.25;
        scene.add(grid);
        
        // ========== PARTICLE MANAGER ==========
        class ParticleSupplyManager {
            constructor(mode = 'recycle') {
                this.mode = mode; // 'recycle', 'inject', 'reset'
                this.injectionRate = 50; // particles per second
                this.injectionPosition = { x: -3, y: 0, z: 0 };
                this.injectionVelocity = { vx: 1.2, vy: 0, vz: 0 };
                this.particleLife = 20000; // max frames before forced reset
            }
            
            setMode(mode) {
                this.mode = mode;
                document.getElementById('supply-mode').innerHTML = mode === 'recycle' ? 'RECYCLE' : (mode === 'inject' ? 'INJECT' : 'RESET');
            }
            
            // Check and handle escaped particles
            handleParticle(particle, bounds, currentFrame) {
                let escaped = false;
                let newPos = { x: particle.x, y: particle.y, z: particle.z };
                let newVel = { vx: particle.vx, vy: particle.vy, vz: particle.vz };
                
                // Check bounds
                if (Math.abs(particle.x) > bounds.xMax || 
                    Math.abs(particle.y) > bounds.yMax || 
                    Math.abs(particle.z) > bounds.zMax) {
                    escaped = true;
                }
                
                // Age-based reset (prevents particles from living forever)
                if (particle.age && particle.age > this.particleLife) {
                    escaped = true;
                }
                
                if (!escaped) {
                    return { x: particle.x, y: particle.y, z: particle.z, 
                             vx: particle.vx, vy: particle.vy, vz: particle.vz, 
                             age: (particle.age || 0) + 1 };
                }
                
                // Handle escaped particle based on mode
                if (this.mode === 'recycle') {
                    // Recycle: reappear on opposite side
                    newPos.x = -Math.sign(particle.x) * bounds.xMax * 0.95;
                    newPos.y = -Math.sign(particle.y) * bounds.yMax * 0.95;
                    newPos.z = -Math.sign(particle.z) * bounds.zMax * 0.95;
                    newVel = { vx: particle.vx * 0.9, vy: particle.vy * 0.9, vz: particle.vz * 0.9 };
                } else if (this.mode === 'inject') {
                    // Inject at specified inlet
                    newPos.x = this.injectionPosition.x;
                    newPos.y = this.injectionPosition.y + (Math.random() - 0.5) * 1.5;
                    newPos.z = this.injectionPosition.z + (Math.random() - 0.5) * 1.5;
                    newVel = { 
                        vx: this.injectionVelocity.vx + (Math.random() - 0.5) * 0.3,
                        vy: this.injectionVelocity.vy + (Math.random() - 0.5) * 0.3,
                        vz: this.injectionVelocity.vz + (Math.random() - 0.5) * 0.3
                    };
                } else {
                    // Reset mode: random position within bounds
                    newPos.x = (Math.random() - 0.5) * bounds.xMax * 1.5;
                    newPos.y = (Math.random() - 0.5) * bounds.yMax * 1.2;
                    newPos.z = (Math.random() - 0.5) * bounds.zMax * 1.5;
                    newVel = { 
                        vx: (Math.random() - 0.5) * 1.0,
                        vy: (Math.random() - 0.5) * 0.8,
                        vz: (Math.random() - 0.5) * 0.8
                    };
                }
                
                return { ...newPos, ...newVel, age: 0 };
            }
        }
        
        const supplyManager = new ParticleSupplyManager('recycle');
        
        // Toggle supply mode with 'M' key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'm' || e.key === 'M') {
                const modes = ['recycle', 'inject', 'reset'];
                const currentIndex = modes.indexOf(supplyManager.mode);
                const newMode = modes[(currentIndex + 1) % modes.length];
                supplyManager.setMode(newMode);
            }
        });
        
        // Manual reset button
        document.getElementById('manual-reset').addEventListener('click', () => {
            if (scene.userData.resetParticles) {
                scene.userData.resetParticles();
            }
        });
        
        // ========== TAB 1: AIRFOIL ==========
        function initAirfoil() {
            clearScene();
            
            const airfoilGeo = new THREE.BoxGeometry(2.0, 0.12, 1.0);
            const airfoilMat = new THREE.MeshStandardMaterial({ color: 0x3366cc, metalness: 0.85, roughness: 0.25 });
            const airfoil = new THREE.Mesh(airfoilGeo, airfoilMat);
            airfoil.position.set(-1.0, 0.2, 0);
            airfoil.rotation.z = 0.15;
            scene.add(airfoil);
            scene.userData.airfoil = airfoil;
            
            const PARTICLE_COUNT = 60000;
            const bounds = { xMax: 6.0, yMax: 4.0, zMax: 5.0 };
            
            let positions = new Float32Array(PARTICLE_COUNT * 3);
            let velocities = new Array(PARTICLE_COUNT);
            let colors = new Float32Array(PARTICLE_COUNT * 3);
            let ages = new Array(PARTICLE_COUNT).fill(0);
            
            function resetParticle(i, forceRandom = false) {
                let x, y, z;
                if (forceRandom || supplyManager.mode === 'reset') {
                    x = (Math.random() - 0.5) * bounds.xMax * 1.5;
                    y = (Math.random() - 0.5) * bounds.yMax * 1.2;
                    z = (Math.random() - 0.5) * bounds.zMax * 1.5;
                } else {
                    x = supplyManager.injectionPosition.x + (Math.random() - 0.5) * 1.5;
                    y = supplyManager.injectionPosition.y + (Math.random() - 0.5) * 1.2;
                    z = supplyManager.injectionPosition.z + (Math.random() - 0.5) * 1.5;
                }
                positions[i*3] = x;
                positions[i*3+1] = y;
                positions[i*3+2] = z;
                velocities[i] = {
                    vx: 0.9 + Math.random() * 0.6,
                    vy: (Math.random() - 0.5) * 0.6,
                    vz: (Math.random() - 0.5) * 0.6
                };
                ages[i] = 0;
            }
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                resetParticle(i, true);
                colors[i*3] = 0.3 + Math.random() * 0.4;
                colors[i*3+1] = 0.4 + Math.random() * 0.5;
                colors[i*3+2] = 0.7 + Math.random() * 0.3;
            }
            
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const mat = new THREE.PointsMaterial({ size: 0.045, vertexColors: true, blending: THREE.AdditiveBlending });
            const particleSystem = new THREE.Points(geo, mat);
            scene.add(particleSystem);
            
            scene.userData.particleSystem = particleSystem;
            scene.userData.velocities = velocities;
            scene.userData.ages = ages;
            scene.userData.bounds = bounds;
            
            scene.userData.resetParticles = () => {
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    resetParticle(i, true);
                }
                const posAttr = particleSystem.geometry.attributes.position;
                posAttr.array.set(positions);
                posAttr.needsUpdate = true;
            };
            
            document.getElementById('particle-count').innerText = PARTICLE_COUNT.toLocaleString();
            document.getElementById('re-val').innerText = '1.00e+7';
            
            let lastTime = performance.now();
            let frameCounter = 0;
            
            function animate() {
                const now = performance.now();
                let delta = Math.min(0.033, (now - lastTime) / 1000);
                lastTime = now;
                
                const posAttr = particleSystem.geometry.attributes.position;
                const colAttr = particleSystem.geometry.attributes.color;
                const posArray = posAttr.array;
                const colArray = colAttr.array;
                const velArray = scene.userData.velocities;
                const ageArray = scene.userData.ages;
                const dt = delta * 0.7;
                
                let activeCount = 0;
                
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const ix = i*3, iy = i*3+1, iz = i*3+2;
                    let px = posArray[ix], py = posArray[iy], pz = posArray[iz];
                    let vx = velArray[i].vx, vy = velArray[i].vy, vz = velArray[i].vz;
                    
                    // Flow field
                    let newVx = 1.1 + 0.2 * Math.sin(pz * 1.5);
                    let newVy = 0.15 * Math.sin(px * 1.8);
                    let newVz = 0.3 * Math.sin(py * 2.0);
                    
                    const foilX = px + 1.0, foilY = py - 0.2;
                    const dist = Math.hypot(foilX, foilY);
                    const circ = 0.9 * Math.exp(-dist * 1.3) * Math.atan2(foilY, foilX);
                    newVx += circ * 0.8;
                    newVy += circ * 0.4;
                    
                    // Turbulence
                    newVx += Math.sin(px * 3.5) * Math.cos(pz * 2.5) * 0.1;
                    newVy += Math.cos(py * 4.0) * Math.sin(px * 3.0) * 0.1;
                    newVz += Math.sin(pz * 4.2) * Math.cos(py * 3.5) * 0.1;
                    
                    let newX = px + newVx * dt;
                    let newY = py + newVy * dt;
                    let newZ = pz + newVz * dt;
                    
                    // Airfoil collision
                    if (Math.abs(newX + 1.0) < 1.0 && Math.abs(newY - 0.2) < 0.18 && Math.abs(newZ) < 0.6) {
                        newVy = Math.abs(newVy) * 0.6;
                        newY = 0.35;
                    }
                    
                    // Check for escape and handle via supply manager
                    const escaped = (Math.abs(newX) > bounds.xMax || 
                                    Math.abs(newY) > bounds.yMax || 
                                    Math.abs(newZ) > bounds.zMax);
                    
                    if (escaped) {
                        const recycled = supplyManager.handleParticle(
                            { x: newX, y: newY, z: newZ, vx: newVx, vy: newVy, vz: newVz, age: ageArray[i] },
                            bounds,
                            frameCounter
                        );
                        newX = recycled.x;
                        newY = recycled.y;
                        newZ = recycled.z;
                        newVx = recycled.vx;
                        newVy = recycled.vy;
                        newVz = recycled.vz;
                        ageArray[i] = recycled.age || 0;
                    } else {
                        ageArray[i]++;
                        activeCount++;
                    }
                    
                    posArray[ix] = newX;
                    posArray[iy] = newY;
                    posArray[iz] = newZ;
                    velArray[i] = { vx: newVx, vy: newVy, vz: newVz };
                    
                    const speed = Math.hypot(newVx, newVy, newVz);
                    colArray[ix] = 0.3 + Math.min(0.7, speed * 0.6);
                    colArray[iy] = 0.2 + Math.min(0.6, speed * 0.5);
                    colArray[iz] = 0.5 + Math.min(0.5, (1 - speed * 0.4));
                }
                
                posAttr.needsUpdate = true;
                colAttr.needsUpdate = true;
                
                document.getElementById('active-count').innerHTML = activeCount.toLocaleString();
                
                controls.update();
                effectComposer.render();
                requestAnimationFrame(animate);
                frameCounter++;
            }
            
            scene.userData.animation = animate;
            animate();
        }
        
        // ========== TAB 2: HEMODYNAMICS ==========
        function initHemodynamics() {
            clearScene();
            
            const vesselGeo = new THREE.TorusKnotGeometry(1.0, 0.16, 200, 32, 3, 4);
            const vesselMat = new THREE.MeshStandardMaterial({ color: 0xcc3366, emissive: 0x331122 });
            const vessel = new THREE.Mesh(vesselGeo, vesselMat);
            vessel.position.set(0, 0, 0);
            scene.add(vessel);
            scene.userData.vessel = vessel;
            
            const PARTICLE_COUNT = 50000;
            const bounds = { xMax: 3.5, yMax: 3.0, zMax: 3.5 };
            
            let positions = new Float32Array(PARTICLE_COUNT * 3);
            let velocities = new Array(PARTICLE_COUNT);
            let colors = new Float32Array(PARTICLE_COUNT * 3);
            let ages = new Array(PARTICLE_COUNT).fill(0);
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                positions[i*3] = (Math.random() - 0.5) * 5;
                positions[i*3+1] = (Math.random() - 0.5) * 4;
                positions[i*3+2] = (Math.random() - 0.5) * 5;
                velocities[i] = { vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5, vz: (Math.random()-0.5)*0.5 };
                colors[i*3] = 0.5 + Math.random()*0.4;
                colors[i*3+1] = 0.2 + Math.random()*0.3;
                colors[i*3+2] = 0.4 + Math.random()*0.4;
                ages[i] = 0;
            }
            
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const mat = new THREE.PointsMaterial({ size: 0.05, vertexColors: true, blending: THREE.AdditiveBlending });
            const particleSystem = new THREE.Points(geo, mat);
            scene.add(particleSystem);
            
            scene.userData.particleSystem = particleSystem;
            scene.userData.velocities = velocities;
            scene.userData.ages = ages;
            scene.userData.bounds = bounds;
            
            scene.userData.resetParticles = () => {
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    positions[i*3] = (Math.random() - 0.5) * 5;
                    positions[i*3+1] = (Math.random() - 0.5) * 4;
                    positions[i*3+2] = (Math.random() - 0.5) * 5;
                    ages[i] = 0;
                }
                particleSystem.geometry.attributes.position.array.set(positions);
                particleSystem.geometry.attributes.position.needsUpdate = true;
            };
            
            document.getElementById('particle-count').innerText = PARTICLE_COUNT.toLocaleString();
            document.getElementById('re-val').innerText = '1,200';
            
            let lastTime = performance.now();
            let frameCounter = 0;
            
            function animate() {
                const now = performance.now();
                let delta = Math.min(0.033, (now - lastTime) / 1000);
                lastTime = now;
                
                const posAttr = particleSystem.geometry.attributes.position;
                const colAttr = particleSystem.geometry.attributes.color;
                const posArray = posAttr.array;
                const colArray = colAttr.array;
                const velArray = scene.userData.velocities;
                const ageArray = scene.userData.ages;
                const dt = delta * 0.7;
                
                const womersleyPulse = 1 + 0.35 * Math.sin(7.85 * frameCounter * 0.016);
                
                let activeCount = 0;
                
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const ix = i*3, iy = i*3+1, iz = i*3+2;
                    let px = posArray[ix], py = posArray[iy], pz = posArray[iz];
                    
                    const rad = Math.hypot(px, pz);
                    const angle = Math.atan2(pz, px);
                    
                    let newVx = -Math.sin(angle) * 0.8 * womersleyPulse;
                    let newVz = Math.cos(angle) * 0.8 * womersleyPulse;
                    let newVy = Math.sin(angle * 2.5) * 0.3;
                    
                    if (rad > 1.1) {
                        newVx += (px - Math.sin(angle)*1.0) * 0.2;
                        newVz += (pz - Math.cos(angle)*1.0) * 0.2;
                    }
                    
                    let newX = px + newVx * dt;
                    let newY = py + newVy * dt;
                    let newZ = pz + newVz * dt;
                    
                    const escaped = (Math.hypot(newX, newZ) > bounds.xMax || Math.abs(newY) > bounds.yMax);
                    
                    if (escaped) {
                        const recycled = supplyManager.handleParticle(
                            { x: newX, y: newY, z: newZ, vx: newVx, vy: newVy, vz: newVz, age: ageArray[i] },
                            bounds,
                            frameCounter
                        );
                        newX = recycled.x;
                        newY = recycled.y;
                        newZ = recycled.z;
                        newVx = recycled.vx;
                        newVy = recycled.vy;
                        newVz = recycled.vz;
                        ageArray[i] = recycled.age || 0;
                    } else {
                        ageArray[i]++;
                        activeCount++;
                    }
                    
                    posArray[ix] = newX;
                    posArray[iy] = newY;
                    posArray[iz] = newZ;
                    velArray[i] = { vx: newVx, vy: newVy, vz: newVz };
                    
                    const speed = Math.hypot(newVx, newVy, newVz);
                    colArray[ix] = 0.6 + Math.min(0.4, speed);
                    colArray[iy] = 0.2 + Math.min(0.5, speed * 0.8);
                    colArray[iz] = 0.3 + Math.min(0.4, speed * 0.6);
                }
                
                posAttr.needsUpdate = true;
                colAttr.needsUpdate = true;
                
                if (scene.userData.vessel) {
                    scene.userData.vessel.scale.set(womersleyPulse, womersleyPulse, womersleyPulse);
                }
                
                document.getElementById('active-count').innerHTML = activeCount.toLocaleString();
                
                controls.update();
                effectComposer.render();
                requestAnimationFrame(animate);
                frameCounter++;
            }
            
            scene.userData.animation = animate;
            animate();
        }
        
        // Simplified versions for other tabs (similar structure)
        function initRossby() { initGeneric('rossby'); }
        function initNonNewtonian() { initGeneric('nonnewton'); }
        
        function initGeneric(type) {
            clearScene();
            
            const PARTICLE_COUNT = type === 'rossby' ? 55000 : 60000;
            const bounds = { xMax: 6.0, yMax: 4.0, zMax: 6.0 };
            
            let positions = new Float32Array(PARTICLE_COUNT * 3);
            let velocities = new Array(PARTICLE_COUNT);
            let colors = new Float32Array(PARTICLE_COUNT * 3);
            let ages = new Array(PARTICLE_COUNT).fill(0);
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                positions[i*3] = (Math.random() - 0.5) * 7;
                positions[i*3+1] = (Math.random() - 0.5) * 5;
                positions[i*3+2] = (Math.random() - 0.5) * 7;
                velocities[i] = { vx: (Math.random()-0.5)*0.6, vy: (Math.random()-0.5)*0.5, vz: (Math.random()-0.5)*0.6 };
                colors[i*3] = 0.3 + Math.random()*0.4;
                colors[i*3+1] = 0.4 + Math.random()*0.5;
                colors[i*3+2] = 0.6 + Math.random()*0.4;
                ages[i] = 0;
            }
            
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const mat = new THREE.PointsMaterial({ size: 0.048, vertexColors: true, blending: THREE.AdditiveBlending });
            const particleSystem = new THREE.Points(geo, mat);
            scene.add(particleSystem);
            
            scene.userData.particleSystem = particleSystem;
            scene.userData.velocities = velocities;
            scene.userData.ages = ages;
            scene.userData.bounds = bounds;
            
            scene.userData.resetParticles = () => {
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    positions[i*3] = (Math.random() - 0.5) * 7;
                    positions[i*3+1] = (Math.random() - 0.5) * 5;
                    positions[i*3+2] = (Math.random() - 0.5) * 7;
                    ages[i] = 0;
                }
                particleSystem.geometry.attributes.position.array.set(positions);
                particleSystem.geometry.attributes.position.needsUpdate = true;
            };
            
            document.getElementById('particle-count').innerHTML = PARTICLE_COUNT.toLocaleString();
            document.getElementById('re-val').innerHTML = type === 'rossby' ? '1.2e+12' : '0.01~1000';
            
            let lastTime = performance.now();
            let frameCounter = 0;
            
            function animate() {
                const now = performance.now();
                let delta = Math.min(0.033, (now - lastTime) / 1000);
                lastTime = now;
                
                const posAttr = particleSystem.geometry.attributes.position;
                const colAttr = particleSystem.geometry.attributes.color;
                const posArray = posAttr.array;
                const colArray = colAttr.array;
                const velArray = scene.userData.velocities;
                const ageArray = scene.userData.ages;
                const dt = delta * 0.65;
                
                let activeCount = 0;
                
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const ix = i*3, iy = i*3+1, iz = i*3+2;
                    let px = posArray[ix], py = posArray[iy], pz = posArray[iz];
                    let vx = velArray[i].vx, vy = velArray[i].vy, vz = velArray[i].vz;
                    
                    let newVx = vx * 0.99 + (Math.random() - 0.5) * 0.02;
                    let newVy = vy * 0.99 + (Math.random() - 0.5) * 0.02;
                    let newVz = vz * 0.99 + (Math.random() - 0.5) * 0.02;
                    
                    let newX = px + newVx * dt;
                    let newY = py + newVy * dt;
                    let newZ = pz + newVz * dt;
                    
                    const escaped = (Math.abs(newX) > bounds.xMax || Math.abs(newY) > bounds.yMax || Math.abs(newZ) > bounds.zMax);
                    
                    if (escaped) {
                        const recycled = supplyManager.handleParticle(
                            { x: newX, y: newY, z: newZ, vx: newVx, vy: newVy, vz: newVz, age: ageArray[i] },
                            bounds,
                            frameCounter
                        );
                        newX = recycled.x;
                        newY = recycled.y;
                        newZ = recycled.z;
                        newVx = recycled.vx;
                        newVy = recycled.vy;
                        newVz = recycled.vz;
                        ageArray[i] = recycled.age || 0;
                    } else {
                        ageArray[i]++;
                        activeCount++;
                    }
                    
                    posArray[ix] = newX;
                    posArray[iy] = newY;
                    posArray[iz] = newZ;
                    velArray[i] = { vx: newVx, vy: newVy, vz: newVz };
                    
                    const speed = Math.hypot(newVx, newVy, newVz);
                    colArray[ix] = 0.3 + Math.min(0.5, speed * 0.4);
                    colArray[iy] = 0.4 + Math.min(0.4, Math.abs(newVx) * 0.5);
                    colArray[iz] = 0.6 + Math.min(0.3, speed * 0.3);
                }
                
                posAttr.needsUpdate = true;
                colAttr.needsUpdate = true;
                
                document.getElementById('active-count').innerHTML = activeCount.toLocaleString();
                
                controls.update();
                effectComposer.render();
                requestAnimationFrame(animate);
                frameCounter++;
            }
            
            scene.userData.animation = animate;
            animate();
        }
        
        function clearScene() {
            if (scene.userData.particleSystem) {
                scene.remove(scene.userData.particleSystem);
            }
            if (scene.userData.airfoil) scene.remove(scene.userData.airfoil);
            if (scene.userData.vessel) scene.remove(scene.userData.vessel);
            if (scene.userData.rings) scene.userData.rings.forEach(r => scene.remove(r));
            if (scene.userData.coreSphere) scene.remove(scene.userData.coreSphere);
            
            camera.position.set(5, 4, 8);
            controls.target.set(0, 0, 0);
            controls.update();
        }
        
        // FPS Counter
        let fpsFrameCount = 0;
        let fpsLastTime = performance.now();
        function updateFPS() {
            fpsFrameCount++;
            const now = performance.now();
            if (now - fpsLastTime >= 1000) {
                document.getElementById('fps-val').innerText = Math.round((fpsFrameCount * 1000) / (now - fpsLastTime));
                fpsFrameCount = 0;
                fpsLastTime = now;
            }
            requestAnimationFrame(updateFPS);
        }
        updateFPS();
        
        // Tab switching
        const tabs = {
            airfoil: initAirfoil,
            hemo: initHemodynamics,
            rossby: initRossby,
            nonnewton: initNonNewtonian
        };
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tabs[btn.dataset.tab]();
            });
        });
        
        initAirfoil();
        
        // Guide message
        console.log('%c🔄 PARTICLE SUPPLY SYSTEM ACTIVE', 'color: #0f0; font-size: 12px;');
        console.log('Press M to cycle supply modes: RECYCLE → INJECT → RESET');
        console.log('Click RESET PARTICLES to manually respawn all particles');
    </script>
</body>
</html>
