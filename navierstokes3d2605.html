<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>4-in-1 NAVIER-STOKES | Airfoil · Hemodynamics · Rossby · Non-Newtonian</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: 'Monaco', 'Fira Code', monospace; }
        
        /* Tab Navigation */
        .tab-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 300;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            pointer-events: auto;
        }
        .tab-btn {
            background: rgba(0,0,0,0.8);
            border: 1px solid #0ff;
            color: #0ff;
            padding: 8px 18px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        .tab-btn.active {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 15px #0ff;
        }
        .tab-btn:hover:not(.active) {
            background: #0ff3;
        }
        
        /* Info Panel */
        .info-panel {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            border-top: 2px solid #0ff;
            padding: 10px 15px;
            z-index: 300;
            pointer-events: auto;
            font-size: 10px;
            color: #0ff;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 10px;
        }
        .info-item {
            display: flex;
            gap: 8px;
            align-items: baseline;
        }
        .info-label {
            color: #888;
        }
        .info-value {
            color: #ffaa44;
            font-weight: bold;
        }
        
        /* Control buttons */
        .ctrl-group {
            position: absolute;
            top: 80px;
            right: 15px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
        }
        .ctrl-btn {
            background: rgba(0,0,0,0.7);
            border: 1px solid #ffaa44;
            color: #ffaa44;
            padding: 6px 12px;
            font-size: 10px;
            cursor: pointer;
            font-family: monospace;
        }
        .ctrl-btn:hover {
            background: #ffaa44;
            color: #000;
        }
        
        @media (max-width: 700px) {
            .tab-btn { padding: 4px 10px; font-size: 9px; }
            .info-panel { font-size: 8px; padding: 6px 10px; }
            .ctrl-btn { padding: 3px 8px; font-size: 8px; }
        }
    </style>
</head>
<body>
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="airfoil">✈️ AIRFOIL · RANS SST k-ω</button>
        <button class="tab-btn" data-tab="hemo">🩸 HEMODYNAMICS · Womersley α</button>
        <button class="tab-btn" data-tab="rossby">🌍 ROSSBY WAVE · β-plane</button>
        <button class="tab-btn" data-tab="nonnewton">🧬 NON-NEWTONIAN · Carreau-Yasuda</button>
    </div>
    
    <div class="ctrl-group">
        <button id="reset-cam" class="ctrl-btn">⟳ RESET CAMERA</button>
        <button id="toggle-fog" class="ctrl-btn">🌫️ TOGGLE FOG</button>
    </div>
    
    <div class="info-panel" id="info-panel">
        <div class="info-item"><span class="info-label">PARTICLES:</span><span id="particle-count" class="info-value">--</span></div>
        <div class="info-item"><span class="info-label">FPS:</span><span id="fps-val" class="info-value">--</span></div>
        <div class="info-item"><span class="info-label">Re:</span><span id="re-val" class="info-value">--</span></div>
        <div class="info-item"><span class="info-label">Key Parameter:</span><span id="key-param" class="info-value">--</span></div>
        <div class="info-item"><span class="info-label">Status:</span><span id="status-val" class="info-value">RUNNING</span></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ========== GLOBAL SETUP ==========
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010118);
        scene.fog = new THREE.FogExp2(0x010118, 0.002);
        
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 4, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        document.body.appendChild(renderer.domElement);
        
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.1, 0.3, 0.85);
        effectComposer.addPass(bloomPass);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.zoomSpeed = 1.2;
        controls.target.set(0, 0, 0);
        
        document.getElementById('reset-cam').addEventListener('click', () => {
            camera.position.set(5, 4, 8);
            controls.target.set(0, 0, 0);
            controls.update();
        });
        
        let fogEnabled = true;
        document.getElementById('toggle-fog').addEventListener('click', () => {
            fogEnabled = !fogEnabled;
            scene.fog = fogEnabled ? new THREE.FogExp2(0x010118, 0.002) : null;
        });
        
        // Lights
        const ambient = new THREE.AmbientLight(0x111122);
        scene.add(ambient);
        const mainLight = new THREE.DirectionalLight(0x88aaff, 1);
        mainLight.position.set(2, 5, 3);
        scene.add(mainLight);
        const fillLight = new THREE.PointLight(0xffaa66, 0.5);
        fillLight.position.set(-2, 2, 3);
        scene.add(fillLight);
        
        // Grid
        const grid = new THREE.GridHelper(15, 30, 0x00ccff, 0x3366aa);
        grid.position.y = -1.2;
        grid.material.transparent = true;
        grid.material.opacity = 0.25;
        scene.add(grid);
        
        // ========== PARTICLE SYSTEM BASE ==========
        let currentParticleSystem = null;
        let currentAnimationId = null;
        let simTime = 0;
        
        // ========== TAB 1: AIRFOIL (RANS SST k-ω) ==========
        function initAirfoil() {
            clearScene();
            
            // Airfoil model
            const airfoilGeo = new THREE.BoxGeometry(2.0, 0.12, 1.0);
            const airfoilMat = new THREE.MeshStandardMaterial({ color: 0x3366cc, metalness: 0.85, roughness: 0.25 });
            const airfoil = new THREE.Mesh(airfoilGeo, airfoilMat);
            airfoil.position.set(-1.0, 0.2, 0);
            airfoil.rotation.z = 0.15;
            scene.add(airfoil);
            
            // Store for cleanup
            scene.userData.airfoil = airfoil;
            
            const PARTICLE_COUNT = 80000;
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const velocities = new Array(PARTICLE_COUNT);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                positions[i*3] = (Math.random() - 0.5) * 8;
                positions[i*3+1] = (Math.random() - 0.5) * 5 + 0.3;
                positions[i*3+2] = (Math.random() - 0.5) * 5;
                velocities[i] = { vx: 0.9 + Math.random()*0.6, vy: (Math.random()-0.5)*0.6, vz: (Math.random()-0.5)*0.6 };
                colors[i*3] = 0.3 + Math.random()*0.4;
                colors[i*3+1] = 0.4 + Math.random()*0.5;
                colors[i*3+2] = 0.7 + Math.random()*0.3;
            }
            
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const mat = new THREE.PointsMaterial({ size: 0.045, vertexColors: true, blending: THREE.AdditiveBlending });
            const particleSystem = new THREE.Points(geo, mat);
            scene.add(particleSystem);
            
            scene.userData.particleSystem = particleSystem;
            scene.userData.velocities = velocities;
            
            // Update info
            document.getElementById('particle-count').innerText = '80,000';
            document.getElementById('re-val').innerText = '1.00e+7';
            document.getElementById('key-param').innerHTML = 'k=0.042 | ω=12.7';
            
            // Animation function
            let lastTime = performance.now();
            function animate() {
                const now = performance.now();
                let delta = Math.min(0.033, (now - lastTime) / 1000);
                lastTime = now;
                simTime += delta;
                
                const posAttr = particleSystem.geometry.attributes.position;
                const colAttr = particleSystem.geometry.attributes.color;
                const posArray = posAttr.array;
                const colArray = colAttr.array;
                const velArray = scene.userData.velocities;
                const dt = delta * 0.7;
                
                let maxSpeed = 0;
                
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const ix = i*3, iy = i*3+1, iz = i*3+2;
                    let px = posArray[ix], py = posArray[iy], pz = posArray[iz];
                    
                    let vx = 1.1 + 0.2 * Math.sin(pz * 1.5);
                    let vy = 0.15 * Math.sin(px * 1.8 + simTime * 2.5);
                    let vz = 0.3 * Math.sin(py * 2.0 + simTime * 2.0);
                    
                    // Airfoil circulation
                    const foilX = px + 1.0, foilY = py - 0.2;
                    const dist = Math.hypot(foilX, foilY);
                    const circ = 0.9 * Math.exp(-dist * 1.3) * Math.atan2(foilY, foilX);
                    vx += circ * 0.8;
                    vy += circ * 0.4;
                    
                    // SST k-ω turbulence
                    const turbK = 0.042 + Math.sin(simTime)*0.01;
                    vx += Math.sin(px*3.5 + simTime*10) * Math.cos(pz*2.5) * 0.1 * turbK;
                    vy += Math.cos(py*4.0 + simTime*9) * Math.sin(px*3.0) * 0.1 * turbK;
                    vz += Math.sin(pz*4.2 + simTime*11) * Math.cos(py*3.5) * 0.1 * turbK;
                    
                    let newX = px + vx * dt;
                    let newY = py + vy * dt;
                    let newZ = pz + vz * dt;
                    
                    // Boundary
                    if (Math.abs(newX) > 5.5) { vx *= -0.8; newX = Math.sign(newX) * 5.4; }
                    if (Math.abs(newY) > 3.5) { vy *= -0.8; newY = Math.sign(newY) * 3.4; }
                    if (Math.abs(newZ) > 4.5) { vz *= -0.8; newZ = Math.sign(newZ) * 4.4; }
                    
                    // Airfoil collision
                    if (Math.abs(newX + 1.0) < 1.0 && Math.abs(newY - 0.2) < 0.18 && Math.abs(newZ) < 0.6) {
                        vy = Math.abs(vy) * 0.6;
                        newY = 0.35;
                    }
                    
                    posArray[ix] = newX; posArray[iy] = newY; posArray[iz] = newZ;
                    velArray[i] = { vx, vy, vz };
                    
                    const speed = Math.hypot(vx, vy, vz);
                    maxSpeed = Math.max(maxSpeed, speed);
                    
                    colArray[ix] = 0.3 + Math.min(0.7, speed * 0.6);
                    colArray[iy] = 0.2 + Math.min(0.6, speed * 0.5);
                    colArray[iz] = 0.5 + Math.min(0.5, (1 - speed * 0.4));
                }
                
                posAttr.needsUpdate = true;
                colAttr.needsUpdate = true;
                
                controls.update();
                effectComposer.render();
                requestAnimationFrame(animate);
            }
            
            scene.userData.animation = animate;
            animate();
        }
        
        // ========== TAB 2: HEMODYNAMICS (Womersley) ==========
        function initHemodynamics() {
            clearScene();
            
            // Vessel (torus)
            const vesselGeo = new THREE.TorusKnotGeometry(1.0, 0.16, 200, 32, 3, 4);
            const vesselMat = new THREE.MeshStandardMaterial({ color: 0xcc3366, emissive: 0x331122 });
            const vessel = new THREE.Mesh(vesselGeo, vesselMat);
            vessel.position.set(0, 0, 0);
            scene.add(vessel);
            scene.userData.vessel = vessel;
            
            const PARTICLE_COUNT = 60000;
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const velocities = new Array(PARTICLE_COUNT);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                positions[i*3] = (Math.random() - 0.5) * 5;
                positions[i*3+1] = (Math.random() - 0.5) * 4;
                positions[i*3+2] = (Math.random() - 0.5) * 5;
                velocities[i] = { vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5, vz: (Math.random()-0.5)*0.5 };
                colors[i*3] = 0.5 + Math.random()*0.4;
                colors[i*3+1] = 0.2 + Math.random()*0.3;
                colors[i*3+2] = 0.4 + Math.random()*0.4;
            }
            
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const mat = new THREE.PointsMaterial({ size: 0.05, vertexColors: true, blending: THREE.AdditiveBlending });
            const particleSystem = new THREE.Points(geo, mat);
            scene.add(particleSystem);
            
            scene.userData.particleSystem = particleSystem;
            scene.userData.velocities = velocities;
            
            document.getElementById('particle-count').innerText = '60,000';
            document.getElementById('re-val').innerText = '1,200';
            document.getElementById('key-param').innerHTML = 'α = 18.3 | T = 0.8s';
            
            let lastTime = performance.now();
            function animate() {
                const now = performance.now();
                let delta = Math.min(0.033, (now - lastTime) / 1000);
                lastTime = now;
                simTime += delta;
                
                const posAttr = particleSystem.geometry.attributes.position;
                const colAttr = particleSystem.geometry.attributes.color;
                const posArray = posAttr.array;
                const colArray = colAttr.array;
                const dt = delta * 0.7;
                
                const womersleyPulse = 1 + 0.35 * Math.sin(7.85 * simTime);
                
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const ix = i*3, iy = i*3+1, iz = i*3+2;
                    let px = posArray[ix], py = posArray[iy], pz = posArray[iz];
                    
                    const rad = Math.hypot(px, pz);
                    const angle = Math.atan2(pz, px);
                    
                    let vx = -Math.sin(angle) * 0.8 * womersleyPulse;
                    let vz = Math.cos(angle) * 0.8 * womersleyPulse;
                    let vy = Math.sin(angle * 2.5 + simTime * 10) * 0.3;
                    
                    if (rad > 1.1) {
                        vx += (px - Math.sin(angle)*1.0) * 0.2;
                        vz += (pz - Math.cos(angle)*1.0) * 0.2;
                    }
                    
                    let newX = px + vx * dt;
                    let newY = py + vy * dt;
                    let newZ = pz + vz * dt;
                    
                    if (Math.hypot(newX, newZ) > 2.5) {
                        vx *= -0.5; vz *= -0.5;
                        newX = Math.sign(newX) * 2.4;
                        newZ = Math.sign(newZ) * 2.4;
                    }
                    if (Math.abs(newY) > 2.5) { vy *= -0.7; newY = Math.sign(newY) * 2.4; }
                    
                    posArray[ix] = newX; posArray[iy] = newY; posArray[iz] = newZ;
                    
                    const speed = Math.hypot(vx, vy, vz);
                    colArray[ix] = 0.6 + Math.min(0.4, speed);
                    colArray[iy] = 0.2 + Math.min(0.5, speed * 0.8);
                    colArray[iz] = 0.3 + Math.min(0.4, speed * 0.6);
                }
                
                posAttr.needsUpdate = true;
                colAttr.needsUpdate = true;
                
                if (scene.userData.vessel) {
                    scene.userData.vessel.scale.set(womersleyPulse, womersleyPulse, womersleyPulse);
                }
                
                controls.update();
                effectComposer.render();
                requestAnimationFrame(animate);
            }
            
            scene.userData.animation = animate;
            animate();
        }
        
        // ========== TAB 3: ROSSBY WAVE (β-plane) ==========
        function initRossby() {
            clearScene();
            
            // Rossby wave rings
            const ring1 = new THREE.Mesh(new THREE.RingGeometry(1.2, 1.8, 64), new THREE.MeshBasicMaterial({ color: 0x33aaff, transparent: true, opacity: 0.4, side: THREE.DoubleSide }));
            ring1.position.set(0, 0.2, 0);
            ring1.rotation.x = -Math.PI / 2;
            scene.add(ring1);
            
            const ring2 = new THREE.Mesh(new THREE.RingGeometry(2.0, 2.6, 64), new THREE.MeshBasicMaterial({ color: 0x88ddff, transparent: true, opacity: 0.25, side: THREE.DoubleSide }));
            ring2.position.set(0, 0.2, 0);
            ring2.rotation.x = -Math.PI / 2;
            scene.add(ring2);
            
            scene.userData.rings = [ring1, ring2];
            
            const PARTICLE_COUNT = 70000;
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const velocities = new Array(PARTICLE_COUNT);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                positions[i*3] = (Math.random() - 0.5) * 7;
                positions[i*3+1] = (Math.random() - 0.5) * 4;
                positions[i*3+2] = (Math.random() - 0.5) * 7;
                velocities[i] = { vx: (Math.random()-0.5)*0.6, vy: (Math.random()-0.5)*0.4, vz: (Math.random()-0.5)*0.6 };
                colors[i*3] = 0.3 + Math.random()*0.3;
                colors[i*3+1] = 0.5 + Math.random()*0.4;
                colors[i*3+2] = 0.7 + Math.random()*0.3;
            }
            
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const mat = new THREE.PointsMaterial({ size: 0.048, vertexColors: true, blending: THREE.AdditiveBlending });
            const particleSystem = new THREE.Points(geo, mat);
            scene.add(particleSystem);
            
            scene.userData.particleSystem = particleSystem;
            scene.userData.velocities = velocities;
            
            document.getElementById('particle-count').innerText = '70,000';
            document.getElementById('re-val').innerText = '1.2e+12';
            document.getElementById('key-param').innerHTML = 'Ro = 0.08 | β = 1.6e-11';
            
            let lastTime = performance.now();
            function animate() {
                const now = performance.now();
                let delta = Math.min(0.033, (now - lastTime) / 1000);
                lastTime = now;
                simTime += delta;
                
                const posAttr = particleSystem.geometry.attributes.position;
                const colAttr = particleSystem.geometry.attributes.color;
                const posArray = posAttr.array;
                const colArray = colAttr.array;
                const dt = delta * 0.65;
                
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const ix = i*3, iy = i*3+1, iz = i*3+2;
                    let px = posArray[ix], py = posArray[iy], pz = posArray[iz];
                    
                    // Rossby wave velocity field
                    const k = 1.2, l = 0.9;
                    const beta = 1.6e-11;
                    const rossbyForceX = beta * 100 * Math.sin(k * px + l * pz - simTime * 1.2);
                    const rossbyForceZ = beta * 100 * Math.cos(k * pz - l * px - simTime * 1.0);
                    
                    let vx = 0.3 + rossbyForceX;
                    let vz = 0.2 + rossbyForceZ;
                    let vy = 0.1 * Math.sin(px * 1.5 + simTime * 2.0);
                    
                    let newX = px + vx * dt;
                    let newY = py + vy * dt;
                    let newZ = pz + vz * dt;
                    
                    if (Math.abs(newX) > 5.5) { vx *= -0.9; newX = Math.sign(newX) * 5.4; }
                    if (Math.abs(newY) > 3.5) { vy *= -0.9; newY = Math.sign(newY) * 3.4; }
                    if (Math.abs(newZ) > 5.5) { vz *= -0.9; newZ = Math.sign(newZ) * 5.4; }
                    
                    posArray[ix] = newX; posArray[iy] = newY; posArray[iz] = newZ;
                    
                    const speed = Math.hypot(vx, vy, vz);
                    colArray[ix] = 0.2 + Math.min(0.5, speed * 0.5);
                    colArray[iy] = 0.4 + Math.min(0.5, Math.abs(rossbyForceX) * 2);
                    colArray[iz] = 0.6 + Math.min(0.4, speed * 0.4);
                }
                
                posAttr.needsUpdate = true;
                colAttr.needsUpdate = true;
                
                if (scene.userData.rings) {
                    scene.userData.rings.forEach((ring, idx) => {
                        ring.rotation.z += 0.003 * (idx + 1);
                    });
                }
                
                controls.update();
                effectComposer.render();
                requestAnimationFrame(animate);
            }
            
            scene.userData.animation = animate;
            animate();
        }
        
        // ========== TAB 4: NON-NEWTONIAN (Carreau-Yasuda) ==========
        function initNonNewtonian() {
            clearScene();
            
            // Decorative sphere (representing viscosity field)
            const coreSphere = new THREE.Mesh(new THREE.SphereGeometry(0.6, 32, 32), new THREE.MeshStandardMaterial({ color: 0xff44aa, emissive: 0x331133, emissiveIntensity: 0.5 }));
            coreSphere.position.set(0, 0, 0);
            scene.add(coreSphere);
            scene.userData.coreSphere = coreSphere;
            
            const PARTICLE_COUNT = 75000;
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const velocities = new Array(PARTICLE_COUNT);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            const shearRates = new Float32Array(PARTICLE_COUNT);
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                positions[i*3] = (Math.random() - 0.5) * 6;
                positions[i*3+1] = (Math.random() - 0.5) * 5;
                positions[i*3+2] = (Math.random() - 0.5) * 6;
                velocities[i] = { vx: (Math.random()-0.5)*0.8, vy: (Math.random()-0.5)*0.6, vz: (Math.random()-0.5)*0.8 };
                colors[i*3] = 0.4 + Math.random()*0.5;
                colors[i*3+1] = 0.2 + Math.random()*0.4;
                colors[i*3+2] = 0.6 + Math.random()*0.4;
                shearRates[i] = 0;
            }
            
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const mat = new THREE.PointsMaterial({ size: 0.052, vertexColors: true, blending: THREE.AdditiveBlending });
            const particleSystem = new THREE.Points(geo, mat);
            scene.add(particleSystem);
            
            scene.userData.particleSystem = particleSystem;
            scene.userData.velocities = velocities;
            scene.userData.shearRates = shearRates;
            
            document.getElementById('particle-count').innerText = '75,000';
            document.getElementById('re-val').innerHTML = '0.01 ~ 1,000';
            document.getElementById('key-param').innerHTML = 'μ₀=0.016 | μ∞=0.0035 | n=0.2128';
            
            function carreauYasuda(gammaDot) {
                const mu0 = 0.016, muInf = 0.0035, lam = 0.110, a = 0.644, n = 0.2128;
                return muInf + (mu0 - muInf) * Math.pow(1 + Math.pow(lam * gammaDot, a), (n - 1) / a);
            }
            
            let lastTime = performance.now();
            function animate() {
                const now = performance.now();
                let delta = Math.min(0.033, (now - lastTime) / 1000);
                lastTime = now;
                simTime += delta;
                
                const posAttr = particleSystem.geometry.attributes.position;
                const colAttr = particleSystem.geometry.attributes.color;
                const posArray = posAttr.array;
                const colArray = colAttr.array;
                const velArray = scene.userData.velocities;
                const shearArray = scene.userData.shearRates;
                const dt = delta * 0.7;
                
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const ix = i*3, iy = i*3+1, iz = i*3+2;
                    let px = posArray[ix], py = posArray[iy], pz = posArray[iz];
                    
                    // Rotational flow field
                    const angle = Math.atan2(pz, px);
                    const rad = Math.hypot(px, pz);
                    let vx = -Math.sin(angle) * 0.7;
                    let vz = Math.cos(angle) * 0.7;
                    let vy = 0.2 * Math.sin(angle * 3 + simTime * 5);
                    
                    // Shear rate calculation
                    const localShear = Math.abs(vx) + Math.abs(vz) + Math.abs(vy);
                    shearArray[i] = localShear;
                    const mu = carreauYasuda(localShear);
                    const damping = Math.min(1.0, 0.0035 / Math.max(0.002, mu));
                    
                    vx *= damping;
                    vy *= damping;
                    vz *= damping;
                    
                    let newX = px + vx * dt;
                    let newY = py + vy * dt;
                    let newZ = pz + vz * dt;
                    
                    if (Math.hypot(newX, newZ) > 4.0) {
                        vx *= -0.7; vz *= -0.7;
                        newX = Math.sign(newX) * 3.9;
                        newZ = Math.sign(newZ) * 3.9;
                    }
                    if (Math.abs(newY) > 3.0) { vy *= -0.8; newY = Math.sign(newY) * 2.9; }
                    
                    posArray[ix] = newX; posArray[iy] = newY; posArray[iz] = newZ;
                    velArray[i] = { vx, vy, vz };
                    
                    // Color based on viscosity (higher viscosity = redder)
                    const muNorm = Math.min(1, (mu - 0.0035) / 0.0125);
                    colArray[ix] = 0.3 + muNorm * 0.7;
                    colArray[iy] = 0.2 + muNorm * 0.3;
                    colArray[iz] = 0.5 + (1 - muNorm) * 0.5;
                }
                
                posAttr.needsUpdate = true;
                colAttr.needsUpdate = true;
                
                if (scene.userData.coreSphere) {
                    const avgShear = shearArray.reduce((a,b) => a + b, 0) / PARTICLE_COUNT;
                    const intensity = 0.3 + Math.min(0.7, avgShear * 2);
                    scene.userData.coreSphere.material.emissiveIntensity = intensity;
                }
                
                controls.update();
                effectComposer.render();
                requestAnimationFrame(animate);
            }
            
            scene.userData.animation = animate;
            animate();
        }
        
        // ========== UTILITIES ==========
        function clearScene() {
            // Stop current animation
            if (scene.userData.animation) {
                // No easy way to cancel RAF, but new animation will override
            }
            
            // Remove particle system
            if (scene.userData.particleSystem) {
                scene.remove(scene.userData.particleSystem);
                if (scene.userData.particleSystem.geometry) scene.userData.particleSystem.geometry.dispose();
                if (scene.userData.particleSystem.material) scene.userData.particleSystem.material.dispose();
            }
            
            // Remove airfoil if exists
            if (scene.userData.airfoil) scene.remove(scene.userData.airfoil);
            if (scene.userData.vessel) scene.remove(scene.userData.vessel);
            if (scene.userData.rings) scene.userData.rings.forEach(r => scene.remove(r));
            if (scene.userData.coreSphere) scene.remove(scene.userData.coreSphere);
            
            // Reset camera for each mode
            camera.position.set(5, 4, 8);
            controls.target.set(0, 0, 0);
            controls.update();
            
            simTime = 0;
        }
        
        // FPS Counter
        let fpsFrameCount = 0;
        let fpsLastTime = performance.now();
        function updateFPS() {
            fpsFrameCount++;
            const now = performance.now();
            if (now - fpsLastTime >= 1000) {
                const fps = Math.round((fpsFrameCount * 1000) / (now - fpsLastTime));
                document.getElementById('fps-val').innerText = fps;
                fpsFrameCount = 0;
                fpsLastTime = now;
            }
            requestAnimationFrame(updateFPS);
        }
        updateFPS();
        
        // Tab switching
        const tabs = {
            airfoil: initAirfoil,
            hemo: initHemodynamics,
            rossby: initRossby,
            nonnewton: initNonNewtonian
        };
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tabId = btn.dataset.tab;
                if (tabs[tabId]) tabs[tabId]();
            });
        });
        
        // Start with airfoil
        initAirfoil();
    </script>
</body>
</html>
