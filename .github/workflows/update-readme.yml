name: 📝 README 최신 글 자동 갱신

on:
  schedule:
    # 매일 오전 9시 KST (= UTC 00:00)
    - cron: "0 0 * * *"
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 feedparser 설치
        run: pip install feedparser

      - name: 🔄 README 갱신 스크립트 실행
        run: python update_readme.py

      - name: 💾 변경 사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: 최신 블로그 글 자동 반영 📝"
          git push
