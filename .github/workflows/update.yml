name: Update SeoulInside Data

：:
  schedule:
    # 한국시간 기준: 오전 7시 / 낮 12시 / 오후 6시 / 밤 11시 (UTC +9)
    - cron: '0 22 * * *'   # KST 07:00
    - cron: '0 3 * * *'    # KST 12:00
    - cron: '0 9 * * *'    # KST 18:00
    - cron: '0 14 * * *'   # KST 23:00
  workflow_dispatch:        # 수동 실행 버튼도 생김

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: RSS 수집 및 data.json 생성
        run: python fetch_data.py

      - name: data.json을 GitHub에 자동 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "data: auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
