<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BPST Instanton 3D Explorer - Yang-Mills Field Visualization</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'SF Mono', 'Courier New', monospace;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(10, 10, 20, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 12px 20px;
            color: #e0e0ff;
            border: 1px solid rgba(100, 150, 255, 0.3);
            pointer-events: none;
            font-size: 13px;
            font-family: monospace;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        #info h1 {
            margin: 0 0 4px;
            font-size: 18px;
            letter-spacing: 1px;
        }
        #info p {
            margin: 0;
            font-size: 11px;
            opacity: 0.7;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 16px 24px;
            z-index: 100;
            border: 1px solid rgba(100, 150, 255, 0.4);
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            pointer-events: auto;
            font-size: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        .ctrl-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .ctrl-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 140px;
        }
        .ctrl-item label {
            font-size: 10px;
            color: #88aaff;
            letter-spacing: 1px;
        }
        input {
            cursor: pointer;
            background: #1a1a2e;
            border: none;
            height: 4px;
            border-radius: 4px;
            accent-color: #5a7cff;
        }
        .value-display {
            font-size: 11px;
            color: #ffffff;
            background: #1a1a2e;
            padding: 2px 8px;
            border-radius: 20px;
            text-align: center;
        }
        button {
            background: rgba(90, 124, 255, 0.2);
            border: 1px solid #5a7cff;
            color: #ccddff;
            padding: 6px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-family: monospace;
            font-size: 11px;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #5a7cff;
            color: #0a0a14;
            box-shadow: 0 0 12px rgba(90,124,255,0.5);
        }
        .status {
            background: #0a0a14cc;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 11px;
            border-left: 3px solid #5a7cff;
        }
        @media (max-width: 700px) {
            .ctrl-group { gap: 12px; }
            .ctrl-item { min-width: 110px; }
            #controls { padding: 12px 16px; flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>⚡ TWIST THE FIELD — BPST INSTANTON</h1>
        <p>Yang-Mills | Tr(F∧*F) ∝ Q | Mass gap Δ > 0 (Millennium Problem) | SU(2) Gauge Field</p>
    </div>
    <div id="controls">
        <div class="ctrl-group">
            <div class="ctrl-item">
                <label>TOPOLOGICAL CHARGE <span style="color:#ffaa66;">Q</span></label>
                <input type="range" id="charge-slider" min="1" max="5" step="1" value="2">
                <div class="value-display" id="charge-val">Q = 2</div>
            </div>
            <div class="ctrl-item">
                <label>INSTANTON SCALE <span style="color:#88ffaa;">ρ</span></label>
                <input type="range" id="rho-slider" min="0.3" max="2.2" step="0.01" value="1.0">
                <div class="value-display" id="rho-val">ρ = 1.00</div>
            </div>
            <div class="ctrl-item">
                <label>TIME SLICE <span style="color:#ffaa88;">x₄ = t</span></label>
                <input type="range" id="time-slider" min="-2.0" max="2.0" step="0.02" value="0.0">
                <div class="value-display" id="time-val">t = 0.00</div>
            </div>
        </div>
        <div class="ctrl-group">
            <div class="ctrl-item">
                <label>ACTION S = 8π²|Q|</label>
                <div class="value-display" id="action-val">S = 0.0</div>
            </div>
            <div class="ctrl-item">
                <label>PEAK |F|²</label>
                <div class="value-display" id="peak-val">0.00</div>
            </div>
            <div class="status" id="status-text">✦ Stable instanton | Finite action</div>
            <button id="reset-btn">⟳ RESET</button>
        </div>
    </div>

    <!-- Import Three.js core and add-ons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- setup scene, camera, renderers ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.008);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4.5, 3.5, 5.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true; // subtle shadows
        document.body.appendChild(renderer.domElement);

        // CSS2 renderer for text labels
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // --- controls for interactivity ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.2;
        controls.rotateSpeed = 1.0;
        controls.target.set(0, 0, 0);

        // --- lighting (dramatic volumetric style) ---
        const ambientLight = new THREE.AmbientLight(0x22223b);
        scene.add(ambientLight);
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(2, 5, 3);
        mainLight.castShadow = true;
        mainLight.receiveShadow = false;
        scene.add(mainLight);
        const fillLight = new THREE.PointLight(0x4466cc, 0.5);
        fillLight.position.set(-2, 1, 3);
        scene.add(fillLight);
        const backLight = new THREE.PointLight(0xffaa66, 0.4);
        backLight.position.set(0, 1, -3);
        scene.add(backLight);
        
        // starfield particle system (depth effect)
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 1800;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 200;
            starPositions[i*3+1] = (Math.random() - 0.5) * 100;
            starPositions[i*3+2] = (Math.random() - 0.5) * 80 - 40;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.08, transparent: true, opacity: 0.6 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);
        
        // decorative grid + axis helper (subtle)
        const gridHelper = new THREE.GridHelper(12, 20, 0x3366aa, 0x224466);
        gridHelper.position.y = -1.8;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.25;
        scene.add(gridHelper);
        
        const axesHelper = new THREE.AxesHelper(3.5);
        axesHelper.material.transparent = true;
        axesHelper.material.opacity = 0.12;
        scene.add(axesHelper);
        
        // a faint transparent sphere to show spatial reference
        const referenceSphere = new THREE.Mesh(
            new THREE.SphereGeometry(2.2, 32, 16),
            new THREE.MeshPhongMaterial({ color: 0x2266aa, wireframe: true, transparent: true, opacity: 0.08 })
        );
        scene.add(referenceSphere);
        
        // --- Yang-Mills field visualization: volume points + isosurface style ---
        // we generate a set of points in 3D space (x,y, x4=t slice influence)
        // intensity = Tr(F^2) ~ rho^2 / ((r^2 + rho^2)^4) but for visual we use non-linear mapping.
        // For multi-instanton (Q > 1) we sum contributions from Q "centers" on a circle in the XY plane.
        
        let pointsMesh = null;
        let particleField = null;
        let currentCharge = 2;
        let currentRho = 1.0;
        let currentT = 0.0;
        
        // color mapping helpers (plasma-like)
        function getColorForIntensity(intensity, maxIntensity) {
            let t = Math.min(1.0, intensity / maxIntensity);
            // from deep blue -> cyan -> yellow -> white
            const r = Math.min(1.0, t * 1.6);
            const g = Math.min(1.0, t * 1.2);
            const b = Math.min(1.0, 0.4 + t * 0.8);
            return new THREE.Color(r, g, b);
        }
        
        // compute field strength at a point (x,y,z) with given t-slice, charge, rho
        // positions: array of [cx, cy, cz] for instanton centers
        function computeFieldStrength(x, y, z, rhoVal, tVal, centers) {
            let sum = 0.0;
            for (let c of centers) {
                const dx = x - c[0];
                const dy = y - c[1];
                const dz = z - c[2];
                const r2 = dx*dx + dy*dy + dz*dz + tVal*tVal;
                const denom = (r2 + rhoVal*rhoVal);
                if (denom < 1e-6) return 1e6;
                // BPST action density shape: ~ rho^2 / (r^2+rho^2)^2   -> but we want energy density Tr(F^2)
                // Actually Tr(F^2) ∝ rho^2 / (r^2+rho^2)^4? No, for instanton: tr(F^2) ~ 48 rho^4/(r^2+rho^2)^4.
                // We use a perceptual mapping for volume rendering.
                const intensity = (rhoVal * rhoVal) / ((r2 + rhoVal*rhoVal) * (r2 + rhoVal*rhoVal) + 1e-8);
                sum += intensity;
            }
            return sum;
        }
        
        function generateInstantonCenters(charge) {
            const centers = [];
            if (charge === 1) {
                centers.push([0, 0, 0]);
            } else {
                const radius = 1.2;
                for (let i = 0; i < charge; i++) {
                    const angle = (i / charge) * Math.PI * 2;
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;
                    centers.push([x, y, 0]);
                }
            }
            return centers;
        }
        
        function buildFieldVisualization(charge, rhoVal, tVal) {
            const centers = generateInstantonCenters(charge);
            // sample points in a volume: resolution 55x55x35 for performance & beauty
            const bounds = 2.8;
            const stepsX = 70;
            const stepsY = 70;
            const stepsZ = 50;
            
            const positions = [];
            const colors = [];
            
            let maxIntensitySeen = 0;
            const intensityCache = new Array(stepsX * stepsY * stepsZ);
            
            // first pass: compute max intensity for normalization
            let idx = 0;
            for (let i = 0; i < stepsX; i++) {
                const x = -bounds + (i / (stepsX-1)) * bounds * 2;
                for (let j = 0; j < stepsY; j++) {
                    const y = -bounds + (j / (stepsY-1)) * bounds * 2;
                    for (let k = 0; k < stepsZ; k++) {
                        const z = -bounds + (k / (stepsZ-1)) * bounds * 2;
                        let val = computeFieldStrength(x, y, z, rhoVal, tVal, centers);
                        // boost small values for visibility
                        val = Math.pow(val, 0.55);
                        intensityCache[idx] = val;
                        if (val > maxIntensitySeen) maxIntensitySeen = val;
                        idx++;
                    }
                }
            }
            
            if (maxIntensitySeen < 0.01) maxIntensitySeen = 0.5;
            // second pass: build geometry with threshold to reduce clutter
            idx = 0;
            const threshold = maxIntensitySeen * 0.12;
            for (let i = 0; i < stepsX; i++) {
                const x = -bounds + (i / (stepsX-1)) * bounds * 2;
                for (let j = 0; j < stepsY; j++) {
                    const y = -bounds + (j / (stepsY-1)) * bounds * 2;
                    for (let k = 0; k < stepsZ; k++) {
                        const z = -bounds + (k / (stepsZ-1)) * bounds * 2;
                        const intensity = intensityCache[idx];
                        if (intensity > threshold) {
                            positions.push(x, y, z);
                            const color = getColorForIntensity(intensity, maxIntensitySeen);
                            colors.push(color.r, color.g, color.b);
                        }
                        idx++;
                    }
                }
            }
            
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));
            
            const material = new THREE.PointsMaterial({ size: 0.065, vertexColors: true, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending });
            const pointsObj = new THREE.Points(geometry, material);
            return { pointsObj, maxIntensity: maxIntensitySeen };
        }
        
        // Additional effect: glowing corona particles around instanton cores
        let glowPoints = null;
        function updateGlowCores(charge, rhoVal, tVal) {
            if (glowPoints) scene.remove(glowPoints);
            const centers = generateInstantonCenters(charge);
            const glowCount = 600;
            const positions = [];
            for (let c of centers) {
                for (let i = 0; i < glowCount / charge; i++) {
                    // random sphere around center with radius ~ rho
                    const radius = rhoVal * (0.8 + Math.random() * 0.7);
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const x = c[0] + radius * Math.sin(phi) * Math.cos(theta);
                    const y = c[1] + radius * Math.sin(phi) * Math.sin(theta);
                    const z = c[2] + radius * Math.cos(phi);
                    positions.push(x, y, z);
                }
            }
            const glowGeo = new THREE.BufferGeometry();
            glowGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
            const glowMat = new THREE.PointsMaterial({ color: 0xffaa66, size: 0.045, transparent: true, blending: THREE.AdditiveBlending, opacity: 0.5 });
            glowPoints = new THREE.Points(glowGeo, glowMat);
            scene.add(glowPoints);
        }
        
        // label for mass gap / Q info
        const labelDiv = document.createElement('div');
        labelDiv.textContent = `Δ > 0 (Mass Gap Conjecture) · S = 8π²|Q|`;
        labelDiv.style.color = '#ccddff';
        labelDiv.style.fontSize = '12px';
        labelDiv.style.fontFamily = 'monospace';
        labelDiv.style.backgroundColor = 'rgba(0,0,0,0.6)';
        labelDiv.style.padding = '4px 12px';
        labelDiv.style.borderRadius = '20px';
        labelDiv.style.borderLeft = '3px solid #ffaa66';
        const labelObj = new CSS2DObject(labelDiv);
        labelObj.position.set(2.2, 2.5, 0);
        scene.add(labelObj);
        
        let currentVisual = null;
        let currentMax = 1.0;
        
        function refreshVisualization() {
            if (currentVisual) scene.remove(currentVisual);
            const charge = parseInt(document.getElementById('charge-slider').value);
            const rhoVal = parseFloat(document.getElementById('rho-slider').value);
            const tVal = parseFloat(document.getElementById('time-slider').value);
            
            const { pointsObj, maxIntensity } = buildFieldVisualization(charge, rhoVal, tVal);
            currentVisual = pointsObj;
            scene.add(currentVisual);
            currentMax = maxIntensity;
            
            // update UI values
            document.getElementById('charge-val').innerHTML = `Q = ${charge}`;
            document.getElementById('rho-val').innerHTML = `ρ = ${rhoVal.toFixed(2)}`;
            document.getElementById('time-val').innerHTML = `t = ${tVal.toFixed(2)}`;
            const actionVal = (8 * Math.PI * Math.PI * charge).toFixed(2);
            document.getElementById('action-val').innerHTML = `S = ${actionVal}`;
            document.getElementById('peak-val').innerHTML = `${(maxIntensity * 1.2).toFixed(3)}`;
            
            // update status message
            const statusDiv = document.getElementById('status-text');
            if (rhoVal < 0.45 && charge >= 4) {
                statusDiv.innerHTML = `⚠️ High concentration | Field approaches singular limit but remains smooth — action finite`;
                statusDiv.style.borderLeftColor = '#ff8866';
            } else if (charge === 5) {
                statusDiv.innerHTML = `🌟 Q = 5 MAX TOPOLOGY | Action = ${actionVal} | Millennium challenge: prove gap Δ > 0`;
                statusDiv.style.borderLeftColor = '#ffaa66';
            } else {
                statusDiv.innerHTML = `✦ BPST instanton | Finite action | Mass gap Δ > 0 (unsolved)`;
                statusDiv.style.borderLeftColor = '#5a7cff';
            }
            updateGlowCores(charge, rhoVal, tVal);
        }
        
        // event listeners
        document.getElementById('charge-slider').addEventListener('input', () => refreshVisualization());
        document.getElementById('rho-slider').addEventListener('input', () => refreshVisualization());
        document.getElementById('time-slider').addEventListener('input', () => refreshVisualization());
        document.getElementById('reset-btn').addEventListener('click', () => {
            document.getElementById('charge-slider').value = '2';
            document.getElementById('rho-slider').value = '1.0';
            document.getElementById('time-slider').value = '0.0';
            refreshVisualization();
            camera.position.set(4.5, 3.5, 5.5);
            controls.target.set(0, 0, 0);
            controls.update();
        });
        
        // initial build
        refreshVisualization();
        
        // animated rotation of starfield for subtle dynamism
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.003;
            stars.rotation.y = time * 0.1;
            stars.rotation.x = Math.sin(time * 0.2) * 0.1;
            if (glowPoints) {
                glowPoints.rotation.y = time * 0.2;
                glowPoints.rotation.z = Math.sin(time * 0.5) * 0.05;
            }
            controls.update(); // update orbit
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        
        animate();
        
        // window resize handler
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // small console hint
        console.log('Yang-Mills 3D Explorer | BPST instanton | Mass gap Δ > 0 Millennium Problem');
    </script>
</body>
</html>
