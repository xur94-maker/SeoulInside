<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeoulInside — 링크 모음</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: #2a2a2a;
    --border2: #333333;
    --text: #e8e8e8;
    --text2: #888888;
    --text3: #555555;
    --accent: #c8f060;
    --accent-dim: rgba(200,240,96,0.12);
    --accent-dim2: rgba(200,240,96,0.06);
    --red: #ff5c5c;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(15,15,15,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
  }
  .header-inner {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: .04em;
    flex-shrink: 0;
  }
  .search-wrap { flex: 1; position: relative; }
  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    width: 14px;
    height: 14px;
  }
  #search {
    width: 100%;
    padding: 8px 12px 8px 30px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    transition: border-color .2s;
  }
  #search:focus { border-color: var(--border2); }
  #search::placeholder { color: var(--text3); }

  .btn {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 8px 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text2);
    font-size: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    white-space: nowrap;
    transition: all .2s;
  }
  .btn:hover { border-color: var(--border2); color: var(--text); }
  .btn.accent { background: var(--accent-dim); border-color: rgba(200,240,96,0.3); color: var(--accent); }
  .btn.accent:hover { background: rgba(200,240,96,0.2); }

  .stats-bar {
    max-width: 680px;
    margin: 0 auto;
    padding: 10px 24px;
    font-size: 11px;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
  }

  .add-form {
    max-width: 680px;
    margin: 0 auto 8px;
    padding: 0 24px;
    display: none;
    gap: 8px;
    flex-wrap: wrap;
  }
  .add-form.open { display: flex; }
  .add-form input {
    flex: 1;
    min-width: 160px;
    padding: 9px 12px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    transition: border-color .2s;
  }
  .add-form input:focus { border-color: var(--accent); }
  .add-form input::placeholder { color: var(--text3); }

  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 4px 24px 60px;
  }

  .link-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 4px;
    transition: border-color .15s, background .15s;
  }
  .link-item:hover { border-color: var(--border2); background: var(--surface2); }
  .link-item.top-item { border-color: rgba(200,240,96,0.25); background: var(--accent-dim2); }

  .rank {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--text3);
    min-width: 20px;
    text-align: right;
    flex-shrink: 0;
  }
  .favicon {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    flex-shrink: 0;
    object-fit: contain;
  }
  .link-name {
    flex: 1;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    text-decoration: none;
    transition: color .15s;
  }
  .link-name:hover { color: var(--accent); }
  .link-url {
    font-size: 11px;
    color: var(--text3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 160px;
    font-family: 'DM Mono', monospace;
    flex-shrink: 0;
  }
  .count-badge {
    font-size: 11px;
    font-weight: 500;
    font-family: 'DM Mono', monospace;
    color: var(--text3);
    background: var(--border);
    border-radius: 99px;
    padding: 2px 9px;
    min-width: 30px;
    text-align: center;
    flex-shrink: 0;
    transition: all .2s;
  }
  .count-badge.has-count { color: var(--accent); background: var(--accent-dim); }

  .del-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text3);
    font-size: 16px;
    padding: 2px 4px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity .15s, color .15s;
    line-height: 1;
    flex-shrink: 0;
  }
  .link-item:hover .del-btn { opacity: 1; }
  .del-btn:hover { color: var(--red); }

  .empty {
    text-align: center;
    padding: 48px 0;
    color: var(--text3);
    font-size: 13px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-3px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .link-item { animation: fadeIn .12s ease; }

  @media (max-width: 500px) {
    .link-url { display: none; }
    header { padding: 12px 16px; }
    main, .add-form, .stats-bar { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">SeoulInside</div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="search" placeholder="링크 검색..." oninput="render()">
    </div>
    <button class="btn accent" onclick="toggleAdd()">＋ 추가</button>
    <button class="btn" onclick="resetCounts()" title="카운트 초기화">↺</button>
  </div>
</header>

<div class="stats-bar" id="stats"></div>

<div class="add-form" id="addForm">
  <input type="text" id="newName" placeholder="이름 (예: 네이버)">
  <input type="text" id="newUrl" placeholder="URL (예: https://naver.com)">
  <button class="btn accent" onclick="addLink()">저장</button>
  <button class="btn" onclick="toggleAdd()">취소</button>
</div>

<main id="main"></main>

<script>
const RAW = [
  {name:"Claude AI",url:"https://claude.ai/new"},
  {name:"Grok",url:"https://grok.com/"},
  {name:"DeepSeek",url:"https://chat.deepseek.com/"},
  {name:"Gemini",url:"https://gemini.google.com/app"},
  {name:"YouTube",url:"https://www.youtube.com/"},
  {name:"YouTube 채널",url:"https://www.youtube.com/channel/UC-9-kyTW8ZkZNDHQJ6FgpwQ"},
  {name:"Facebook",url:"https://www.facebook.com/?locale=ko_KR"},
  {name:"Reddit SeoulInside",url:"https://www.reddit.com/r/seoulinside/"},
  {name:"Substack",url:"https://seoulinside.substack.com/archive?sort=top"},
  {name:"Medium",url:"https://medium.com/p/import"},
  {name:"WordPress",url:"https://wordpress.com/home/seoulinside.wordpress.com"},
  {name:"500px",url:"https://500px.com/manager?view=photos&filter=all"},
  {name:"Ko-fi",url:"https://ko-fi.com/Manage/"},
  {name:"SeoulInside 웹사이트",url:"https://xur94-maker.github.io/SeoulInside/"},
  {name:"SeoulInside 저장소",url:"https://github.com/xur94-maker/SeoulInside"},
  {name:"GitHub Pages 설정",url:"https://github.com/xur94-maker/SeoulInside/settings/pages"},
  {name:"네이버 쇼핑",url:"https://shopping.naver.com/ns/home"},
  {name:"에누리",url:"https://www.enuri.com/"},
  {name:"쿠팡플레이",url:"https://www.coupangplay.com/home"},
  {name:"뽐뿌 부동산",url:"https://www.ppomppu.co.kr/zboard/zboard.php?id=house&hotlist_flag=999"},
  {name:"네이버 부동산",url:"https://new.land.naver.com/complexes?ms=2AKili,3z7ceQ,17&a=APT:ABYG:JGC:PRE&b=A1&e=RETAIL&h=66&i=99&ad=true"},
  {name:"네이버 관심목록",url:"https://new.land.naver.com/interests"},
  {name:"네이버 검색 매물",url:"https://new.land.naver.com/search?ms=2AHO5s,3zdsC3,16&a=APT:PRE:ABYG:JGC&b=A1&e=RETAIL&h=33&i=66&ad=true"},
  {name:"하우스랭킹 뉴스",url:"https://www.houseranking.co.kr/houseranking/news/news_list_today_n.php?aa1=%EA%B2%BD%EA%B8%B0%EB%8F%84&aa2=%EA%B4%91%EB%AA%85%EC%8B%9C&aa3=%ED%95%98%EC%95%88%EB%8F%99&abc=4"},
  {name:"하우스랭킹 매매",url:"https://www.houseranking.co.kr/houseranking/news/news_list_today_n_7.php?aa1=%EA%B2%BD%EA%B8%B0%EB%8F%84&aa2=%EA%B4%91%EB%AA%85%EC%8B%9C&aa3=%ED%95%98%EC%95%88%EB%8F%99&abc=4&ff2=1000&mmtype=%EB%A7%A4%EB%A7%A4&menu=1"},
  {name:"FM코리아 부동산",url:"https://www.fmkorea.com/?mid=realestate"},
  {name:"네이버 카페 재건축",url:"https://search.naver.com/search.naver?ssc=tab.cafe.all&query=%EC%9E%AC%EA%B1%B4%EC%B6%95"},
  {name:"네이버 블로그 재건축",url:"https://search.naver.com/search.naver?ssc=tab.blog.all&query=%EC%9E%AC%EA%B1%B4%EC%B6%95"},
  {name:"네이버 뉴스 재건축",url:"https://search.naver.com/search.naver?where=news&query=%EC%9E%AC%EA%B1%B4%EC%B6%95"},
  {name:"구글 재건축 뉴스",url:"https://www.google.com/search?q=%EC%9E%AC%EA%B1%B4%EC%B6%95&tbm=nws"},
  {name:"네이버 카페",url:"https://cafe.naver.com/x1291"},
  {name:"카페 메뉴",url:"https://cafe.naver.com/f-e/cafes/12730407/menus/195?viewType=L"},
  {name:"다음 KOSPI",url:"https://finance.daum.net/domestic/kospi"},
  {name:"알파스퀘어 삼성전자",url:"https://alphasquare.co.kr/home/stock-summary?code=005930"},
  {name:"Investing 미국",url:"https://kr.investing.com/markets/united-states"},
  {name:"PayPal",url:"https://www.paypal.com/signin"},
  {name:"네이버 페이",url:"https://pay.naver.com/pc/history?page=1"},
  {name:"PikPak",url:"https://mypikpak.com/ko/check-in?from_source=pp_browser_extension"},
  {name:"네이버 메일",url:"https://mail.naver.com/v2/new?type=toMe"},
  {name:"Gmail",url:"https://mail.google.com/mail/u/1/#inbox"},
  {name:"Google 메시지",url:"http://messages.google.com/web/conversations"},
  {name:"구글 포토",url:"https://photos.google.com/u/2/?pageId=none&pli=1"},
  {name:"네이버 마이박스",url:"https://mybox.naver.com/main/web/my"},
  {name:"서울대 포털",url:"https://my.snu.ac.kr/login.jsp"},
  {name:"스누라이프",url:"https://www.snulife.com/main/"},
  {name:"네이버 모바일",url:"https://m.naver.com/"},
  {name:"AAGAG",url:"https://aagag.com/"},
];

const KEY = 'si_links_v3';

function load() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) return JSON.parse(s);
  } catch(e) {}
  return RAW.map((l, i) => ({ ...l, id: i, count: 0 }));
}

function save(links) {
  try { localStorage.setItem(KEY, JSON.stringify(links)); } catch(e) {}
}

let links = load();

function getDomain(url) {
  try { return new URL(url).hostname; } catch { return ''; }
}

function handleClick(id) {
  const l = links.find(x => x.id === id);
  if (!l) return;
  l.count++;
  save(links);
  window.open(l.url, '_blank');
  render();
}

function deleteLink(id) {
  if (!confirm('이 링크를 삭제할까요?')) return;
  links = links.filter(x => x.id !== id);
  save(links);
  render();
}

function resetCounts() {
  if (!confirm('모든 클릭 카운트를 초기화할까요?')) return;
  links.forEach(l => l.count = 0);
  save(links);
  render();
}

function toggleAdd() {
  const f = document.getElementById('addForm');
  f.classList.toggle('open');
  if (f.classList.contains('open')) document.getElementById('newName').focus();
}

function addLink() {
  const name = document.getElementById('newName').value.trim();
  const url = document.getElementById('newUrl').value.trim();
  if (!name || !url) { alert('이름과 URL을 입력해 주세요.'); return; }
  links.unshift({ name, url, id: Date.now(), count: 0 });
  save(links);
  document.getElementById('newName').value = '';
  document.getElementById('newUrl').value = '';
  document.getElementById('addForm').classList.remove('open');
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = links
    .filter(l => l.name.toLowerCase().includes(q) || getDomain(l.url).includes(q))
    .sort((a, b) => b.count - a.count);

  const totalClicks = links.reduce((s, l) => s + l.count, 0);
  const maxCount = Math.max(...links.map(l => l.count), 0);
  document.getElementById('stats').textContent =
    `총 ${links.length}개 링크  ·  누적 클릭 ${totalClicks}회`;

  if (filtered.length === 0) {
    document.getElementById('main').innerHTML = '<div class="empty">검색 결과가 없어요.</div>';
    return;
  }

  let html = '';
  filtered.forEach((l, i) => {
    const isTop = maxCount > 0 && l.count === maxCount;
    const badgeClass = l.count > 0 ? 'count-badge has-count' : 'count-badge';
    const domain = getDomain(l.url);
    html += `<div class="link-item${isTop ? ' top-item' : ''}">
      <span class="rank">${i + 1}</span>
      <img class="favicon" src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" alt="" onerror="this.style.display='none'">
      <a class="link-name" href="${l.url}" onclick="handleClick(${l.id});return false;" title="${l.url}">${l.name}</a>
      <span class="link-url">${domain}</span>
      <span class="${badgeClass}">${l.count}</span>
      <button class="del-btn" onclick="deleteLink(${l.id})" title="삭제" aria-label="삭제">×</button>
    </div>`;
  });

  document.getElementById('main').innerHTML = html;
}

render();
</script>
</body>
</html>
