<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seoul Inside</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- marked.js: 마크다운 → HTML 변환 라이브러리 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<style>
:root {
  --ink: #0f0f0f;
  --paper: #f5f0e8;
  --accent: #c0392b;
  --gold: #b8860b;
  --mid: #6b6456;
  --rule: #d4ccc0;
  --up: #1a7a3a;
  --down: #c0392b;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 300;
  min-height: 100vh;
}

/* ── 티커 바 ── */
.ticker-wrap {
  background: var(--ink);
  color: #e8e0d0;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.72rem;
  padding: 6px 0;
  overflow: hidden;
  white-space: nowrap;
}
.ticker-inner { display: inline-block; animation: ticker 60s linear infinite; }
.ticker-inner span { margin-right: 3rem; }
.ticker-inner .up { color: #4fc87a; }
.ticker-inner .down { color: #ff6b6b; }
@keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* ── 헤더 ── */
header {
  border-bottom: 3px double var(--ink);
  padding: 1.5rem 2rem 1rem;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
}
.masthead h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.2rem, 5vw, 3.8rem);
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 1;
}
.masthead h1 span { color: var(--accent); }
.masthead .tagline {
  font-size: 0.72rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--mid);
  margin-top: 4px;
}
.header-meta {
  text-align: right;
  font-size: 0.72rem;
  color: var(--mid);
  font-family: 'IBM Plex Mono', monospace;
  line-height: 1.7;
}
.refresh-btn {
  margin-top: 6px;
  padding: 4px 12px;
  background: var(--ink);
  color: var(--paper);
  border: none;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: background 0.2s;
}
.refresh-btn:hover { background: var(--accent); }

/* ── 날짜 밴드 ── */
.dateline {
  border-bottom: 1px solid var(--ink);
  padding: 4px 2rem;
  font-size: 0.68rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--mid);
  font-family: 'IBM Plex Mono', monospace;
  display: flex;
  justify-content: space-between;
}

/* ── 그리드 ── */
.grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr 1fr 1fr;
  gap: 0;
  border-bottom: 1px solid var(--rule);
}
@media (max-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

.col {
  padding: 1.4rem 1.5rem;
  border-right: 1px solid var(--rule);
}
.col:last-child { border-right: none; }

/* ── 섹션 타이틀 ── */
.section-label {
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 500;
  border-bottom: 1px solid var(--accent);
  padding-bottom: 4px;
  margin-bottom: 1rem;
}

/* ── ✍ Analysis 목록 (list.md) ── */
.my-post {
  padding: 0.9rem 0;
  border-bottom: 1px solid var(--rule);
}
.my-post:last-child { border-bottom: none; }
.my-post a {
  font-family: 'Playfair Display', serif;
  font-size: 1.02rem;
  font-weight: 700;
  color: var(--ink);
  text-decoration: none;
  line-height: 1.3;
  display: block;
}
.my-post a:hover { color: var(--accent); }
.my-post .post-date {
  font-size: 0.65rem;
  color: var(--mid);
  font-family: 'IBM Plex Mono', monospace;
  margin-top: 4px;
}

/* ── 주식 ── */
.stock-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 5px 0;
  border-bottom: 1px dotted var(--rule);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.78rem;
}
.stock-row:last-child { border-bottom: none; }
.stock-label { color: var(--ink); font-weight: 500; }
.stock-price { color: var(--mid); }
.stock-chg { font-size: 0.7rem; }
.stock-chg.up { color: var(--up); }
.stock-chg.down { color: var(--down); }
.divider-row {
  border-top: 1px solid var(--rule);
  margin: 0.7rem 0;
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--mid);
  padding-top: 6px;
}

/* ── 뉴스 ── */
.news-item {
  padding: 0.65rem 0;
  border-bottom: 1px solid var(--rule);
}
.news-item:last-child { border-bottom: none; }
.news-item a {
  font-size: 0.84rem;
  font-weight: 400;
  color: var(--ink);
  text-decoration: none;
  line-height: 1.45;
  display: block;
}
.news-item a:hover { color: var(--accent); text-decoration: underline; }
.news-item .news-src {
  font-size: 0.62rem;
  color: var(--mid);
  font-family: 'IBM Plex Mono', monospace;
  margin-top: 3px;
}

/* ── 로딩 / 에러 ── */
.loading {
  color: var(--mid);
  font-size: 0.8rem;
  font-family: 'IBM Plex Mono', monospace;
  padding: 1rem 0;
  animation: blink 1.2s step-start infinite;
}
@keyframes blink { 50% { opacity: 0.3; } }

/* ── 푸터 ── */
footer {
  padding: 1rem 2rem;
  font-size: 0.65rem;
  color: var(--mid);
  border-top: 1px solid var(--rule);
  font-family: 'IBM Plex Mono', monospace;
  display: flex;
  justify-content: space-between;
}

/* ── 최신 포스트 전문 (latest.md) ── */
.latest-post-section {
  border-top: 3px double var(--ink);
  padding: 2.5rem 2rem;
  max-width: 860px;
  margin: 0 auto;
}
.latest-post-section .section-label {
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 500;
  border-bottom: 1px solid var(--accent);
  padding-bottom: 4px;
  margin-bottom: 1.6rem;
}
.latest-post-body {
  font-size: 1rem;
  line-height: 1.85;
  color: var(--ink);
}
.latest-post-body p { margin-bottom: 1.1rem; }
.latest-post-body h1,
.latest-post-body h2,
.latest-post-body h3 {
  font-family: 'Playfair Display', serif;
  margin: 1.6rem 0 0.6rem;
}
.latest-post-body a { color: var(--accent); }
.latest-post-body img { max-width: 100%; border-radius: 2px; margin: 1rem 0; }
.latest-post-body blockquote {
  border-left: 3px solid var(--accent);
  padding-left: 1rem;
  color: var(--mid);
  font-style: italic;
  margin: 1rem 0;
}
</style>
</head>
<body>

<!-- 티커 바 -->
<div class="ticker-wrap">
  <div class="ticker-inner" id="ticker">Loading market data…</div>
</div>

<!-- 헤더 -->
<header>
  <div class="masthead">
    <h1>Seoul <span>Inside</span></h1>
    <div class="tagline">Korea · Markets · Analysis · English</div>
  </div>
  <div class="header-meta">
    <div id="updated-at"></div>
    <button class="refresh-btn" onclick="loadAll()">⟳ Refresh</button>
  </div>
</header>

<!-- 날짜 밴드 -->
<div class="dateline">
  <span id="today-date"></span>
  <span>seoulinside.wordpress.com</span>
</div>

<!-- 메인 그리드 -->
<div class="grid">

  <!-- 1열: ✍ Analysis — list.md -->
  <div class="col">
    <div class="section-label">✍ Analysis &amp; Insight</div>
    <div id="my-posts"><div class="loading">Loading…</div></div>
  </div>

  <!-- 2열: 주식 -->
  <div class="col">
    <div class="section-label">📈 Markets</div>
    <div id="stocks"><div class="loading">Loading…</div></div>
  </div>

  <!-- 3열: 글로벌 뉴스 -->
  <div class="col">
    <div class="section-label">🌐 World News</div>
    <div id="global-news"><div class="loading">Loading…</div></div>
  </div>

  <!-- 4열: 한국 관련 기사 -->
  <div class="col">
    <div class="section-label">🇰🇷 Korea Coverage</div>
    <div id="korea-news"><div class="loading">Loading…</div></div>
  </div>

</div>

<!-- 최신 포스트 전문 — latest.md -->
<div class="latest-post-section">
  <div class="section-label">✍ Latest from Seoul Inside</div>
  <div id="latest-post" class="latest-post-body"><div class="loading">Loading latest post…</div></div>
</div>

<footer>
  <span>© Seoul Inside — Curated English coverage of Korea</span>
  <span id="footer-updated"></span>
</footer>

<script>
/* ── 날짜 ── */
const now = new Date();
document.getElementById('today-date').textContent =
  now.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
document.getElementById('updated-at').textContent =
  'Updated: ' + now.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
document.getElementById('footer-updated').textContent =
  'Last update: ' + now.toLocaleString('en-US');

/* ════════════════════════════════
   1) list.md → ✍ Analysis 목록
   형식:
     # 제목 | 날짜
     https://링크
   (빈 줄로 구분)
════════════════════════════════ */
async function loadList() {
  try {
    const res = await fetch('list.md?t=' + Date.now());
    if (!res.ok) throw new Error('list.md not found');
    const text = await res.text();

    // 블록 파싱: "# 제목\n링크" 패턴
    const blocks = text.trim().split(/\n\s*\n/);
    const posts = blocks.map(block => {
      const lines = block.trim().split('\n').map(l => l.trim()).filter(Boolean);
      if (!lines.length) return null;
      const titleLine = lines.find(l => l.startsWith('#')) || '';
      const link      = lines.find(l => l.startsWith('http')) || '#';
      // "# 제목 | 날짜" 분리
      const raw   = titleLine.replace(/^#+\s*/, '');
      const parts = raw.split('|');
      const title = parts[0].trim();
      const date  = parts[1] ? parts[1].trim() : '';
      return { title, link, date };
    }).filter(Boolean);

    if (!posts.length) throw new Error('empty');

    document.getElementById('my-posts').innerHTML = posts.map(p => `
      <div class="my-post">
        <a href="${p.link}" target="_blank" rel="noopener">${p.title}</a>
        <div class="post-date">${p.date}</div>
      </div>`).join('');
  } catch {
    document.getElementById('my-posts').innerHTML =
      '<div class="loading">list.md 파일을 확인해 주세요.</div>';
  }
}

/* ════════════════════════════════
   2) latest.md → 하단 전문
   마크다운 → HTML 변환 (marked.js)
════════════════════════════════ */
async function loadLatest() {
  try {
    const res = await fetch('latest.md?t=' + Date.now());
    if (!res.ok) throw new Error('latest.md not found');
    const text = await res.text();
    document.getElementById('latest-post').innerHTML = marked.parse(text);
  } catch {
    document.getElementById('latest-post').innerHTML =
      '<div class="loading">latest.md 파일을 확인해 주세요.</div>';
  }
}

/* ════════════════════════════════
   3) data.json → 주식 + 뉴스
   (기존 구조 유지, 없으면 안내)
════════════════════════════════ */
function fmtPrice(p) { return p > 0 ? p.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'; }
function fmtChg(c, p) {
  const sign = c >= 0 ? '+' : '';
  return `${sign}${c.toFixed(2)} (${sign}${p.toFixed(2)}%)`;
}

function renderTicker(worlds, koreas) {
  const all = [...worlds, ...koreas];
  const html = all.map(s => {
    const cls  = s.change >= 0 ? 'up' : 'down';
    const sign = s.change >= 0 ? '▲' : '▼';
    return `<span><b>${s.label}</b> ${fmtPrice(s.price)} <span class="${cls}">${sign}${Math.abs(s.pct).toFixed(2)}%</span></span>`;
  }).join('');
  document.getElementById('ticker').innerHTML = html + html;
}

function renderStocks(worlds, koreas) {
  const rows = arr => arr.map(s => {
    const cls = s.change >= 0 ? 'up' : 'down';
    return `<div class="stock-row">
      <span class="stock-label">${s.label}</span>
      <span>
        <span class="stock-price">${fmtPrice(s.price)}</span>&nbsp;
        <span class="stock-chg ${cls}">${fmtChg(s.change, s.pct)}</span>
      </span>
    </div>`;
  }).join('');
  document.getElementById('stocks').innerHTML =
    rows(worlds) + `<div class="divider-row">Korea</div>` + rows(koreas);
}

function renderNews(items, targetId) {
  if (!items || !items.length) {
    document.getElementById(targetId).innerHTML = '<div class="loading">No articles found.</div>';
    return;
  }
  document.getElementById(targetId).innerHTML = items.map(n => `
    <div class="news-item">
      <a href="${n.link}" target="_blank" rel="noopener">${n.title}</a>
      <div class="news-src">${n.date ? n.date.slice(0,16) : ''}</div>
    </div>`).join('');
}

async function loadData() {
  try {
    const res = await fetch('data.json?t=' + Date.now());
    if (!res.ok) throw new Error('no data.json');
    const data = await res.json();
    renderTicker(data.worldStocks || [], data.koreaStocks || []);
    renderStocks(data.worldStocks || [], data.koreaStocks || []);
    renderNews(data.globalNews || [], 'global-news');
    renderNews(data.koreaNews  || [], 'korea-news');
  } catch {
    ['stocks','global-news','korea-news'].forEach(id => {
      document.getElementById(id).innerHTML =
        '<div class="loading">data.json 준비 전입니다.</div>';
    });
    document.getElementById('ticker').innerHTML =
      '<span>Seoul Inside · Korea · Markets · Analysis · English</span>'.repeat(6);
  }
}

/* ── 전체 로드 ── */
function loadAll() {
  loadList();
  loadLatest();
  loadData();
}

loadAll();
</script>
</body>
</html>
