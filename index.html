<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seoul Inside — 추천 글 모음</title>
  <meta name="description" content="Seoul Inside 서브스택의 인기 글과 최신 글을 한눈에 모아봅니다." />
  <meta property="og:title" content="Seoul Inside — 추천 글 모음" />
  <meta property="og:description" content="Seoul Inside 서브스택의 인기 글과 최신 글을 한눈에 모아봅니다." />
  <meta property="og:url" content="https://seoulinside.substack.com/" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+KR:wght@300;400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #0f0e0d;
      --paper: #f5f0e8;
      --cream: #ede8de;
      --accent: #c0392b;
      --accent2: #1a3a5c;
      --muted: #7a7060;
      --rule: #c8bfaa;
      --card-bg: #faf7f2;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Noto Serif KR', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      border-bottom: 3px double var(--ink);
      padding: 2rem 0 1.2rem;
      text-align: center;
      position: relative;
      background: var(--paper);
    }

    .header-date {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .site-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--ink);
    }

    .site-title span {
      color: var(--accent);
      font-style: italic;
    }

    .site-tagline {
      margin-top: 0.5rem;
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .header-rule {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      justify-content: center;
      margin-top: 1rem;
    }
    .header-rule span { width: 40px; height: 1px; background: var(--ink); display: block; }
    .header-rule em { font-family: 'Playfair Display', serif; font-size: 0.8rem; color: var(--muted); font-style: italic; }

    nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--rule);
      background: var(--cream);
    }

    nav a {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--accent); }

    /* ── MAIN GRID ── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.2rem 4rem;
    }

    .sections-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
    }

    @media (max-width: 700px) {
      .sections-grid { grid-template-columns: 1fr; gap: 2rem; }
    }

    /* ── SECTION ── */
    .section-header {
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      margin-bottom: 1.2rem;
      padding-bottom: 0.7rem;
      border-bottom: 2px solid var(--ink);
    }

    .section-badge {
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: var(--ink);
      color: var(--paper);
      padding: 0.2rem 0.5rem;
      border-radius: 2px;
    }

    .section-badge.new { background: var(--accent2); }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .section-count {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      margin-left: auto;
    }

    /* ── ARTICLE CARDS ── */
    .article-list { list-style: none; display: flex; flex-direction: column; gap: 0; }

    .article-item {
      display: flex;
      gap: 0.9rem;
      align-items: flex-start;
      padding: 0.9rem 0;
      border-bottom: 1px solid var(--rule);
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
      border-radius: 4px;
      padding-left: 0.3rem;
      padding-right: 0.3rem;
    }

    .article-item:hover { background: var(--cream); }
    .article-item:last-child { border-bottom: none; }

    .rank-num {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--rule);
      min-width: 2rem;
      line-height: 1;
      padding-top: 0.1rem;
      transition: color 0.2s;
    }

    .article-item:hover .rank-num { color: var(--accent); }
    .rank-num.top3 { color: var(--accent); }

    .article-content { flex: 1; min-width: 0; }

    .article-title {
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 0.3rem;
    }

    .article-meta {
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .article-excerpt {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.25rem;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── LOADING / ERROR ── */
    .loading-wrap {
      text-align: center;
      padding: 3rem 0;
      grid-column: 1 / -1;
    }

    .loading-spinner {
      display: inline-block;
      width: 28px; height: 28px;
      border: 2px solid var(--rule);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.7rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    .error-msg {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      text-align: center;
      padding: 1.5rem;
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: #fdf0ee;
    }

    /* ── FOOTER ── */
    footer {
      border-top: 3px double var(--ink);
      padding: 1.5rem 1rem;
      text-align: center;
      background: var(--cream);
    }

    .footer-inner {
      max-width: 600px;
      margin: 0 auto;
    }

    .footer-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .footer-links { display: flex; gap: 1.2rem; justify-content: center; flex-wrap: wrap; margin-top: 0.6rem; }
    .footer-links a {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
    }
    .footer-links a:hover { color: var(--accent); }

    .footer-note {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.7rem;
    }

    /* ── SUBSCRIBE STRIP ── */
    .subscribe-strip {
      background: var(--ink);
      color: var(--paper);
      text-align: center;
      padding: 1.4rem 1rem;
    }

    .subscribe-strip p {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-style: italic;
      margin-bottom: 0.7rem;
    }

    .subscribe-btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.55rem 1.4rem;
      border-radius: 2px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .subscribe-btn:hover { opacity: 0.85; }

    /* ── ANIMATIONS ── */
    .article-item {
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.35s ease forwards;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .updated-tag {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      color: var(--muted);
      text-align: right;
      margin-top: 1rem;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-date" id="today-date"></div>
    <div class="site-title">Seoul <span>Inside</span></div>
    <div class="site-tagline">서울의 안쪽 — 인기글 & 최신글 큐레이션</div>
    <div class="header-rule">
      <span></span><em>seoulinside.substack.com</em><span></span>
    </div>
  </header>

  <nav>
    <a href="#popular">인기글 Top 7</a>
    <a href="#newest">최신글 Top 7</a>
    <a href="https://seoulinside.substack.com/" target="_blank" rel="noopener">구독하기</a>
  </nav>

  <!-- MAIN -->
  <main>
    <div class="sections-grid" id="sections-grid">
      <div class="loading-wrap" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">글을 불러오는 중...</div>
      </div>
    </div>
  </main>

  <!-- SUBSCRIBE STRIP -->
  <div class="subscribe-strip">
    <p>서울의 속살을 담은 이야기, 놓치지 마세요</p>
    <a class="subscribe-btn" href="https://seoulinside.substack.com/#subscribe" target="_blank" rel="noopener">무료 구독하기 →</a>
  </div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <div class="footer-logo">Seoul Inside</div>
      <div class="footer-links">
        <a href="https://seoulinside.substack.com/" target="_blank" rel="noopener">Substack 홈</a>
        <a href="https://seoulinside.substack.com/archive" target="_blank" rel="noopener">전체 글 보기</a>
        <a href="https://seoulinside.substack.com/#subscribe" target="_blank" rel="noopener">구독</a>
      </div>
      <div class="footer-note">© 2025 Seoul Inside · Powered by Substack RSS</div>
    </div>
  </footer>

  <script>
    // ── 날짜 표시 ──
    const dateEl = document.getElementById('today-date');
    const now = new Date();
    dateEl.textContent = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

    // ── RSS 파싱 ──
    const RSS_URL = 'https://seoulinside.substack.com/feed';
    const PROXY   = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}&count=20`;

    async function loadPosts() {
      try {
        const res  = await fetch(PROXY);
        const data = await res.json();

        if (data.status !== 'ok' || !data.items?.length) {
          showEmpty();
          return;
        }

        const posts = data.items.map(item => ({
          title:   item.title,
          link:    item.link,
          date:    new Date(item.pubDate),
          excerpt: stripHtml(item.description || item.content || ''),
          guid:    item.guid,
        }));

        // 신규순: 날짜 최신순
        const newest = [...posts]
          .sort((a, b) => b.date - a.date)
          .slice(0, 7);

        // 인기순: 현재는 날짜 오래된 순(초기엔 가장 공들인 글) — 추후 좋아요 연동 가능
        // 글이 7개 미만이면 available 전체 사용
        const popular = [...posts]
          .sort((a, b) => a.date - b.date)
          .slice(0, 7);

        renderSections(popular, newest);
      } catch (e) {
        console.error(e);
        showError();
      }
    }

    function stripHtml(html) {
      const d = document.createElement('div');
      d.innerHTML = html;
      return d.textContent.replace(/\s+/g, ' ').trim().slice(0, 120);
    }

    function fmtDate(date) {
      return date.toLocaleDateString('ko-KR', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function renderSections(popular, newest) {
      const grid = document.getElementById('sections-grid');
      grid.innerHTML = '';

      grid.appendChild(buildSection('popular', '인기', '인기글 Top 7', popular));
      grid.appendChild(buildSection('newest',  'new',  '최신글 Top 7', newest));
    }

    function buildSection(id, badgeClass, title, posts) {
      const sec = document.createElement('section');
      sec.id = id;

      const header = `
        <div class="section-header">
          <span class="section-badge ${badgeClass === 'new' ? 'new' : ''}">${badgeClass === 'new' ? 'NEW' : 'HOT'}</span>
          <h2 class="section-title">${title}</h2>
          <span class="section-count">${posts.length}편</span>
        </div>`;

      if (!posts.length) {
        sec.innerHTML = header + `<p class="error-msg">아직 글이 없습니다.<br>첫 글을 기다리고 있어요 ✍️</p>`;
        return sec;
      }

      const items = posts.map((p, i) => `
        <a class="article-item" href="${p.link}" target="_blank" rel="noopener"
           style="animation-delay:${i * 0.06}s">
          <div class="rank-num ${i < 3 ? 'top3' : ''}">${String(i + 1).padStart(2, '0')}</div>
          <div class="article-content">
            <div class="article-title">${escHtml(p.title)}</div>
            <div class="article-meta">${fmtDate(p.date)}</div>
            ${p.excerpt ? `<div class="article-excerpt">${escHtml(p.excerpt)}</div>` : ''}
          </div>
        </a>`).join('');

      const updatedAt = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

      sec.innerHTML = header + `<ul class="article-list">${items}</ul>
        <div class="updated-tag">마지막 업데이트 · ${updatedAt}</div>`;
      return sec;
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showEmpty() {
      const grid = document.getElementById('sections-grid');
      grid.innerHTML = `
        <div class="loading-wrap">
          <div class="error-msg" style="border-color:var(--muted);color:var(--muted);background:transparent">
            아직 발행된 글이 없습니다.<br>첫 번째 글을 기다리고 있어요 ✍️
          </div>
        </div>`;
    }

    function showError() {
      const grid = document.getElementById('sections-grid');
      grid.innerHTML = `
        <div class="loading-wrap">
          <div class="error-msg">
            글을 불러오지 못했습니다.<br>
            잠시 후 새로고침 해주세요.
          </div>
        </div>`;
    }

    loadPosts();
  </script>
</body>
</html>
